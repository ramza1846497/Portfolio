<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>未確認生物調査記録 第0347号</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Zen+Kurenaido&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #15120e;
  --paper: #efe6cf;
  --paper-dark: #e2d5b4;
  --folder: #c9b07a;
  --ink: #2a241c;
  --ink-soft: #5b5040;
  --blue-ink: #1f3a7a;
  --red: #a3221b;
  --note: #d9cfa8;
  --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --hand: "Zen Kurenaido", "Klee", "Hiragino Maru Gothic ProN", cursive;
  --type: "Special Elite", "Courier New", monospace;
  --vt: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(ellipse at 50% 30%, #2a231a 0%, var(--desk) 60%, #070605 100%);
  color: var(--ink);
  font-family: var(--mincho);
  overflow-x: hidden;
}

/* ===== 記録映像オーバーレイ ===== */
#noise {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 50; opacity: .07;
  image-rendering: pixelated; mix-blend-mode: screen;
  transition: opacity .2s;
}
body.unstable #noise { opacity: .13; }
body.glitch #noise { opacity: .4; }
.scanlines {
  position: fixed; inset: 0; pointer-events: none; z-index: 51;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
.vignette {
  position: fixed; inset: 0; pointer-events: none; z-index: 52;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
}
.tracking {
  position: fixed; left: 0; right: 0; height: 18px; top: -30px;
  pointer-events: none; z-index: 53;
  background: linear-gradient(to bottom, transparent, rgba(255,255,255,.08) 40%, rgba(255,255,255,.18) 50%, rgba(255,255,255,.08) 60%, transparent);
  animation: track 9s linear infinite;
}
@keyframes track { 0% { top: -30px; } 70% { top: 105%; } 100% { top: 105%; } }
#flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 54; opacity: 0;
  background: radial-gradient(ellipse at center, transparent 30%, rgba(160,0,0,.6) 100%);
}
#flash.on { animation: flash .7s ease-out; }
@keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }

.osd {
  position: fixed; z-index: 55; pointer-events: none;
  font-family: var(--vt); color: #f3f3f3; font-size: 22px; letter-spacing: 1px;
  text-shadow: 0 0 4px rgba(255,255,255,.6), 2px 0 rgba(255,0,0,.35), -2px 0 rgba(0,200,255,.35);
}
#rec { top: 10px; right: 16px; }
#rec .dot { color: #ff3030; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#osd-play { bottom: 10px; left: 16px; }
#osd-mode { bottom: 10px; right: 16px; }

body.glitch .stage { animation: shake .3s steps(3) 2; }
body.glitch .paper p, body.glitch .paper li, body.glitch .notebook {
  text-shadow: 2px 0 rgba(200,0,0,.45), -2px 0 rgba(0,160,200,.45);
}
@keyframes shake {
  0% { transform: translate(0,0) skewX(0); }
  33% { transform: translate(-4px,2px) skewX(1.5deg); }
  66% { transform: translate(5px,-1px) skewX(-1deg); }
  100% { transform: translate(0,0) skewX(0); }
}
body.unstable .paper .body p { animation: jitter 6s infinite; }
@keyframes jitter {
  0%, 96%, 100% { transform: none; }
  97% { transform: translateX(1px); }
  98% { transform: translateX(-2px); }
}

/* ===== レイアウト ===== */
.stage {
  max-width: 1120px; margin: 0 auto; padding: 56px 16px 64px;
  display: grid; grid-template-columns: 290px 1fr; gap: 28px; align-items: start;
}
@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; padding-top: 48px; gap: 46px; }
}

/* ===== 探索者手帳 ===== */
.notebook {
  position: sticky; top: 52px;
  background:
    repeating-linear-gradient(to bottom, transparent 0 27px, rgba(70,90,140,.22) 27px 28px),
    linear-gradient(135deg, #e6dcbf, #d6c79f);
  border-radius: 4px 10px 10px 4px;
  padding: 18px 18px 18px 34px;
  box-shadow: 0 10px 30px rgba(0,0,0,.6), inset 6px 0 0 #6a2b20, inset 9px 0 0 rgba(0,0,0,.25);
  font-family: var(--hand); color: #26324f;
  transform: rotate(-1.2deg);
}
@media (max-width: 860px) { .notebook { position: relative; top: 0; transform: none; } }
.notebook::before {
  content: ""; position: absolute; left: 14px; top: 16px; bottom: 16px; width: 8px;
  background: radial-gradient(circle, #15120e 3px, transparent 3.5px) 0 0 / 8px 26px repeat-y;
}
.notebook h2 {
  margin: 0 0 6px; font-size: 20px; font-weight: normal; letter-spacing: .1em;
  border-bottom: 1px solid rgba(38,50,79,.4); padding-bottom: 4px;
}
.nb-name { font-size: 22px; line-height: 1.3; }
.nb-job { font-size: 15px; color: #4a5576; margin-bottom: 10px; }
.meter { margin: 8px 0 4px; }
.meter-h { display: flex; justify-content: space-between; font-size: 17px; }
.bar { height: 8px; border: 1px solid #26324f; border-radius: 2px; margin-top: 2px; background: rgba(255,255,255,.3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: #26324f; transition: width .5s; }
.bar.san > i { background: #5a2e7a; }
.bar.low > i { background: var(--red); }
.changed { animation: changed 1s; }
@keyframes changed { 0%, 50% { color: var(--red); transform: scale(1.15); } 100% { transform: none; } }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; margin-top: 10px; font-size: 16px; line-height: 28px; }
.skills div { display: flex; justify-content: space-between; }
.skills b { font-family: var(--type); font-weight: normal; }
.clues { margin: 6px 0 0; padding: 0 0 0 1em; font-size: 15px; line-height: 28px; }
.clues li.none { list-style: none; margin-left: -1em; color: #6b7390; }
.nb-log { font-family: var(--type); font-size: 12px; line-height: 28px; color: #3a4466; max-height: 168px; overflow: hidden; }
.nb-log .ok { color: #1f3a7a; } .nb-log .ng { color: var(--red); }
.nb-sec { margin-top: 14px; }
.nb-sec > span { font-size: 14px; color: #6b7390; letter-spacing: .1em; }

/* ===== 調査ファイル ===== */
.folder { position: relative; background: var(--folder); padding: 22px 16px 16px; border-radius: 0 6px 6px 6px;
  box-shadow: 0 14px 40px rgba(0,0,0,.7); }
.folder .tab {
  position: absolute; top: -26px; left: 0; background: var(--folder); padding: 4px 18px 2px;
  border-radius: 6px 6px 0 0; font-family: var(--type); font-size: 14px; color: #4b3a1c; letter-spacing: .08em;
}
.paper {
  position: relative; background-color: var(--paper);
  background-image:
    radial-gradient(circle at 88% 82%, transparent 46px, rgba(120,72,20,.16) 48px, rgba(120,72,20,.05) 53px, transparent 55px),
    radial-gradient(ellipse at 10% 0%, rgba(150,110,50,.18), transparent 40%),
    radial-gradient(ellipse at 100% 100%, rgba(150,110,50,.22), transparent 45%),
    repeating-linear-gradient(to bottom, transparent 0 31px, rgba(140,120,80,.12) 31px 32px);
  padding: 72px 44px 36px; min-height: 560px;
  box-shadow: 2px 3px 0 var(--paper-dark), 4px 6px 0 #d4c49c, 0 2px 10px rgba(0,0,0,.3);
  line-height: 1.95; font-size: 16.5px;
}
@media (max-width: 600px) { .paper { padding: 88px 18px 28px; font-size: 15.5px; } }
.clip {
  position: absolute; top: -18px; right: 40px; width: 22px; height: 64px;
  border: 3px solid #8b8f96; border-radius: 12px; border-bottom-color: #6f737a; z-index: 2;
}
.clip::after { content: ""; position: absolute; inset: 6px 3px 14px; border: 3px solid #9ea2a8; border-radius: 9px; border-top: none; }
.file-head {
  display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 6px 16px;
  border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 4px;
  font-family: var(--type); font-size: 13px; color: var(--ink-soft); letter-spacing: .05em;
}
.file-head .place { font-family: var(--mincho); font-weight: 700; font-size: 19px; color: var(--ink); letter-spacing: .08em; }
.file-sub { display: flex; justify-content: space-between; font-family: var(--type); font-size: 12px; color: var(--ink-soft); margin-bottom: 18px; border-bottom: 1px solid rgba(42,36,28,.4); padding-bottom: 3px; }
.stamp {
  display: inline-block; font-family: var(--mincho); font-weight: 700; color: var(--red);
  border: 3px double var(--red); padding: 2px 12px; letter-spacing: .25em;
  transform: rotate(-8deg); opacity: .82; mix-blend-mode: multiply;
}
.stamp.big { font-size: 34px; padding: 4px 22px; border-width: 5px; }
.stamp.blue { color: var(--blue-ink); border-color: var(--blue-ink); }
.secret { position: absolute; top: 16px; right: 110px; font-size: 20px; }
.body p { margin: 0 0 1em; animation: inkin .7s both; }
.body p.c { text-align: center; }
.body p.dim { color: var(--ink-soft); font-size: .92em; }
.body .field { font-family: var(--type); font-size: .82em; color: var(--ink-soft); letter-spacing: .06em; margin-right: .4em; }
.body em { font-style: normal; background: linear-gradient(transparent 60%, rgba(163,34,27,.18) 60%); }
.body .voice { font-weight: 700; letter-spacing: .05em; }
.redact { background: #1b1814; color: transparent; border-radius: 1px; user-select: none; }
@keyframes inkin { from { opacity: 0; filter: blur(2px); } to { opacity: 1; filter: none; } }

.carry {
  font-family: var(--hand); color: var(--blue-ink); font-size: 1.04em; line-height: 1.8;
  background: rgba(255,255,255,.35); border-left: 3px solid rgba(31,58,122,.5);
  padding: 10px 14px; margin: 0 0 22px; transform: rotate(-.3deg);
}
.carry p { margin: 0 0 .5em; animation: inkin .6s both; }
.carry p:last-child { margin-bottom: 0; }
.carry .roll { font-family: var(--type); font-size: 13px; color: var(--ink-soft); }
.carry .roll .ok { color: var(--blue-ink); } .carry .roll .ng { color: var(--red); }
.carry .dmg { color: var(--red); font-family: var(--type); font-size: 14px; }

.choices { list-style: none; padding: 0; margin: 26px 0 0; border-top: 1px dashed rgba(42,36,28,.5); padding-top: 16px; }
.choices li { margin: 0 0 10px; animation: inkin .6s both; }
.choices button {
  width: 100%; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: rgba(255,255,255,.28); border: 1px solid rgba(42,36,28,.35); border-radius: 2px;
  padding: 10px 14px 10px 40px; position: relative; line-height: 1.6; transition: background .15s, transform .15s;
}
.choices button::before { content: "□"; position: absolute; left: 14px; top: 10px; font-family: var(--mincho); }
.choices button:hover:not(:disabled), .choices button:focus-visible { background: rgba(255,255,255,.6); transform: translateX(3px); outline: none; }
.choices button:hover:not(:disabled)::before { content: "☑"; color: var(--blue-ink); }
.choices button:disabled { opacity: .5; cursor: default; }
.choices .tag { font-family: var(--type); font-size: 13px; color: var(--blue-ink); margin-left: 6px; white-space: nowrap; }
.choices .tag.auto { color: #5a6b2e; }

/* ===== 記録映像 ===== */
.footage {
  position: relative; background: #0b0d0b; color: #d8e6d0; font-family: var(--vt); font-size: 21px; line-height: 1.45;
  padding: 44px 26px 30px; margin: 0 -10px 10px; border-radius: 6px; overflow: hidden;
  box-shadow: inset 0 0 60px rgba(0,0,0,.9), 0 0 0 6px #222, 0 0 0 8px #0a0a0a;
  text-shadow: 0 0 3px rgba(200,255,200,.5), 1px 0 rgba(255,0,0,.3), -1px 0 rgba(0,180,255,.3);
}
.footage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.04) 0 1px, transparent 1px 3px);
}
.footage::after {
  content: ""; position: absolute; left: 0; right: 0; height: 40px; top: -40px; pointer-events: none;
  background: linear-gradient(transparent, rgba(255,255,255,.1), transparent);
  animation: roll 3.5s linear infinite;
}
@keyframes roll { to { top: 110%; } }
.footage .f-osd { position: absolute; top: 10px; left: 14px; right: 14px; display: flex; justify-content: space-between; font-size: 20px; color: #fff; }
.footage .f-osd .dot { color: #ff3333; animation: blink 1s steps(1) infinite; }
.footage p { margin: 0 0 .7em; }
.footage .face { color: #fff; letter-spacing: 2px; animation: flick .18s steps(2) infinite; }
@keyframes flick { 50% { opacity: .55; } }
.footage + .body { margin-top: 0; }
@media (max-width: 600px) { .footage { font-size: 18px; padding: 40px 16px 24px; margin: 0 0 10px; } }

/* ===== 登録票 ===== */
.form-row { display: flex; gap: 12px; align-items: baseline; margin: 0 0 14px; flex-wrap: wrap; }
.form-row label { font-family: var(--type); font-size: 13px; color: var(--ink-soft); min-width: 96px; letter-spacing: .05em; }
.form-row input[type=text] {
  font-family: var(--hand); font-size: 22px; color: var(--blue-ink); background: transparent;
  border: none; border-bottom: 1px solid var(--ink); padding: 2px 4px; flex: 1; min-width: 180px; outline: none;
}
.jobs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-width: 240px; }
@media (max-width: 600px) { .jobs { grid-template-columns: 1fr; } }
.jobs label { min-width: 0; display: block; font-family: var(--mincho); font-size: 15px; color: var(--ink);
  border: 1px solid rgba(42,36,28,.35); padding: 8px 10px; cursor: pointer; background: rgba(255,255,255,.25); line-height: 1.5; }
.jobs input { margin-right: 6px; accent-color: var(--blue-ink); }
.jobs small { display: block; font-family: var(--type); font-size: 12px; color: var(--ink-soft); }
.jobs label:has(input:checked) { background: rgba(255,255,255,.65); border-color: var(--blue-ink); }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 14px; font-size: 15px; margin: 6px 0 4px; }
@media (max-width: 600px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
.stat-grid div { display: flex; justify-content: space-between; border-bottom: 1px dotted rgba(42,36,28,.4); }
.stat-grid b { font-family: var(--hand); font-weight: normal; color: var(--blue-ink); font-size: 19px; }
.btn {
  font-family: var(--mincho); font-size: 16px; font-weight: 700; letter-spacing: .1em; cursor: pointer;
  background: var(--ink); color: var(--paper); border: none; padding: 10px 22px; border-radius: 2px;
}
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); font-weight: 400; }
.btn:hover { filter: brightness(1.25); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
.rules { font-size: 14px; color: var(--ink-soft); border: 1px solid rgba(42,36,28,.3); padding: 10px 14px; margin-top: 18px; line-height: 1.8; }

/* ===== ダイス判定 ===== */
.overlay {
  position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center;
  background: rgba(5,4,3,.72); padding: 16px;
}
.overlay.hidden { display: none; }
.slip {
  width: min(360px, 100%); background: #f2ead4; padding: 22px 24px 20px; text-align: center; position: relative;
  box-shadow: 0 20px 50px rgba(0,0,0,.8); transform: rotate(1deg);
  background-image: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(140,120,80,.15) 27px 28px);
  animation: slipin .35s ease-out;
}
@keyframes slipin { from { transform: translateY(30px) rotate(4deg); opacity: 0; } }
.slip-h { font-family: var(--type); font-size: 13px; color: var(--ink-soft); letter-spacing: .2em; border-bottom: 1px solid var(--ink); padding-bottom: 4px; }
.slip-label { font-size: 22px; font-weight: 700; margin: 10px 0 0; }
.slip-target { font-family: var(--type); font-size: 14px; color: var(--ink-soft); }
.d-num { font-family: var(--type); font-size: 76px; line-height: 1; margin: 14px 0 6px; color: var(--ink); letter-spacing: .05em; }
.d-num.rolling { color: var(--ink-soft); filter: blur(.6px); }
.d-sub { font-family: var(--type); font-size: 12px; color: var(--ink-soft); }
.d-res { min-height: 58px; margin: 10px 0 4px; }
.d-res .stamp { font-size: 26px; animation: stampin .25s ease-out; }
@keyframes stampin { from { transform: scale(2.4) rotate(-8deg); opacity: 0; } to { transform: scale(1) rotate(-8deg); opacity: .85; } }
.d-extra { font-family: var(--hand); font-size: 19px; color: var(--red); min-height: 26px; }
.slip .btn { margin-top: 10px; width: 100%; }

/* ===== エンディング ===== */
.end-stamp { text-align: center; margin: 10px 0 26px; }
.summary { border: 1px solid var(--ink); padding: 12px 16px; font-size: 14.5px; margin-top: 24px; background: rgba(255,255,255,.25); }
.summary h3 { font-size: 14px; font-family: var(--type); margin: 0 0 6px; letter-spacing: .1em; font-weight: normal; color: var(--ink-soft); }
.summary table { width: 100%; border-collapse: collapse; }
.summary td { padding: 2px 4px; border-bottom: 1px dotted rgba(42,36,28,.35); vertical-align: top; }
.summary td:first-child { width: 8em; color: var(--ink-soft); }
.archive { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.archive span { font-family: var(--type); font-size: 12px; border: 1px solid var(--ink-soft); padding: 2px 8px; color: var(--ink-soft); }
.archive span.got { color: var(--paper); background: var(--ink); border-color: var(--ink); }

@media (prefers-reduced-motion: reduce) {
  .tracking, .footage::after { animation: none; display: none; }
  body.glitch .stage, body.unstable .paper .body p { animation: none; }
}
</style>
</head>
<body>
<canvas id="noise" width="200" height="120" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="tracking" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<div class="osd" id="rec" aria-hidden="true"><span class="dot">●</span> REC <span id="tc">00:00:00</span></div>
<div class="osd" id="osd-play" aria-hidden="true">PLAY ▶ <span id="osd-date">NOV.14 1999</span></div>
<div class="osd" id="osd-mode" aria-hidden="true">SP</div>

<main class="stage">
  <aside class="notebook" id="notebook" aria-label="探索者手帳"></aside>
  <section class="folder">
    <div class="tab">CASE No.0347 ／ 民俗生物調査室</div>
    <article class="paper" id="paper" aria-live="polite"></article>
  </section>
</main>

<div class="overlay hidden" id="dice" role="dialog" aria-modal="true" aria-labelledby="d-label">
  <div class="slip">
    <div class="slip-h" id="d-title">技能判定</div>
    <div class="slip-label" id="d-label"></div>
    <div class="slip-target" id="d-target"></div>
    <div class="d-num" id="d-num">--</div>
    <div class="d-sub">1D100</div>
    <div class="d-res" id="d-res"></div>
    <div class="d-extra" id="d-extra"></div>
    <button class="btn" id="d-btn">ダイスを振る</button>
  </div>
</div>

<script>
"use strict";
/* ================= 基本ユーティリティ ================= */
const $ = (s) => document.querySelector(s);
const paper = $("#paper");
const nb = $("#notebook");
const d = (n) => Math.floor(Math.random() * n) + 1;
function rollExpr(expr) {
  expr = String(expr).trim();
  if (/^\d+$/.test(expr)) return +expr;
  const m = expr.match(/^(\d+)d(\d+)([+-]\d+)?$/);
  if (!m) return 0;
  let t = 0;
  for (let i = 0; i < +m[1]; i++) t += d(+m[2]);
  return t + (m[3] ? +m[3] : 0);
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DEAD = { dead: true };
const store = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch (e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

/* ================= ノイズ演出 ================= */
const noise = $("#noise");
const nctx = noise.getContext("2d");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function drawNoise() {
  const img = nctx.createImageData(noise.width, noise.height);
  const a = img.data;
  for (let i = 0; i < a.length; i += 4) {
    const v = Math.random() * 255;
    a[i] = a[i + 1] = a[i + 2] = v; a[i + 3] = 255;
  }
  // 横方向のトラッキングノイズ
  if (Math.random() < 0.25) {
    const y = Math.floor(Math.random() * noise.height);
    for (let x = 0; x < noise.width; x++) {
      const i = (y * noise.width + x) * 4;
      a[i] = a[i + 1] = a[i + 2] = 255;
    }
  }
  nctx.putImageData(img, 0, 0);
}
setInterval(drawNoise, reduceMotion ? 400 : 70);
drawNoise();
let glitchTimer = null;
function glitch(ms = 450) {

}

}

let prevHp = null, prevSan = null;
function updateSheet() {
  if (!g) {
    nb.innerHTML = `<h2>探索者手帳</h2><p style="font-size:16px;line-height:28px">（未記入）<br>右の登録票に記入し、調査を開始すること。</p>`;
    return;
  }
  const hpPct = Math.max(0, g.hp / g.mhp * 100);
  const sanPct = Math.max(0, g.san / g.msan * 100);
  const clues = Object.keys(CLUES).filter((k) => g.flags[k]);
  nb.innerHTML = `
    <h2>探索者手帳</h2>
    <div class="nb-name">${g.nameH}</div>
    <div class="nb-job">職業：${g.job}</div>
    <div class="meter"><div class="meter-h"><span>耐久力 HP</span><span id="nb-hp">${Math.max(0, g.hp)} / ${g.mhp}</span></div>
      <div class="bar ${hpPct <= 35 ? "low" : ""}"><i style="width:${hpPct}%"></i></div></div>
    <div class="meter"><div class="meter-h"><span>正気度 SAN</span><span id="nb-san">${Math.max(0, g.san)} / ${g.msan}</span></div>
      <div class="bar san ${sanPct <= 40 ? "low" : ""}"><i style="width:${sanPct}%"></i></div></div>
    <div class="skills">${SKILLS.map((k) => `<div><span>${k}</span><b>${g.sk[k]}</b></div>`).join("")}</div>
    <div class="nb-sec"><span>― 手がかり・証拠 ―</span>
      <ul class="clues">${clues.length ? clues.map((k) => `<li>${CLUES[k]}</li>`).join("") : `<li class="none">まだ何もない</li>`}</ul></div>
    <div class="nb-sec"><span>― 判定記録 ―</span>
      <div class="nb-log">${g.log.slice(-6).reverse().join("<br>") || "―"}</div></div>`;
  if (prevHp !== null && g.hp !== prevHp) $("#nb-hp").classList.add("changed");
  if (prevSan !== null && g.san !== prevSan) $("#nb-san").classList.add("changed");
  prevHp = g.hp; prevSan = g.san;
  document.body.classList.toggle("unstable", sanPct <= 40);
}

/* ================= ダイス判定 ================= */
function diceModal({ title, label, target, after }) {
  return new Promise((resolve) => {
    const ov = $("#dice"), num = $("#d-num"), btn = $("#d-btn"), res = $("#d-res"), extra = $("#d-extra");
    $("#d-title").textContent = title;
    $("#d-label").textContent = label;
    $("#d-target").textContent = `目標値 ${target} 以下で成功`;
    num.textContent = "--"; res.innerHTML = ""; extra.textContent = "";
    btn.textContent = "ダイスを振る"; btn.disabled = false;
    ov.classList.remove("hidden");
    btn.focus();
    btn.onclick = () => {
      btn.disabled = true;
      num.classList.add("rolling");
      const iv = setInterval(() => (num.textContent = String(d(100)).padStart(2, "0")), 45);
      setTimeout(() => {
        clearInterval(iv);
        num.classList.remove("rolling");
        const r = d(100);
        num.textContent = r === 100 ? "00" : String(r).padStart(2, "0");
        const crit = r <= 5, fumble = r >= 96;
        const ok = crit || (r <= target && !fumble);
        let word = ok ? "成功" : "失敗";
        if (crit) word = "決定的成功"; if (fumble) word = "致命的失敗";
        res.innerHTML = `<span class="stamp ${ok ? "blue" : ""}">${word}</span>`;
        if (!ok) { glitch(300); }
        extra.textContent = after ? after(r, ok) : "";
        btn.textContent = "手帳に記録する";
        btn.disabled = false;
        btn.focus();
        btn.onclick = () => { ov.classList.add("hidden"); resolve({ r, ok, crit, fumble }); };
      }, reduceMotion ? 200 : 950);
    };
  });
}
async function check(skill, mod = 0) {
  const target = Math.max(1, Math.min(95, g.sk[skill] + mod));
  const modTxt = mod ? `（補正 ${mod > 0 ? "+" : ""}${mod}）` : "";
  const res = await diceModal({ title: "技能判定", label: `〈${skill}〉${modTxt}`, target });
  g.checks++; if (res.ok) g.wins++;
  const word = res.crit ? "決定的成功" : res.fumble ? "致命的失敗" : res.ok ? "成功" : "失敗";
  g.log.push(`<span class="${res.ok ? "ok" : "ng"}">${skill} ${target} → ${res.r} ${word}</span>`);
  g.carry.push(`<p class="roll">▸ 〈${skill}〉 目標値${target} … 出目 ${res.r}　<span class="${res.ok ? "ok" : "ng"}">${word}</span></p>`);
  updateSheet();
  return res;
}
async function sanCheck(okLoss, ngLoss, reason) {
  let loss = 0;
  const res = await diceModal({
    title: "正気度ロール", label: reason, target: g.san,
    after: (r, ok) => { loss = rollExpr(ok ? okLoss : ngLoss); return loss ? `正気度 −${loss}（${ok ? okLoss : ngLoss}）` : "正気度 減少なし"; }
  });
  g.san -= loss;
  g.log.push(`<span class="${res.ok ? "ok" : "ng"}">SAN ${okLoss}/${ngLoss} → ${res.r} −${loss}</span>`);
  g.carry.push(`<p class="roll">▸ 正気度ロール（${esc(reason)}） 出目 ${res.r}　<span class="${res.ok ? "ok" : "ng"}">${res.ok ? "成功" : "失敗"}</span>　<span class="dmg">SAN −${loss}</span></p>`);
  if (loss) glitch(300 + loss * 120);
  updateSheet();
  if (g.san <= 0) throw DEAD;
  return res;
}
function hurt(expr, reason) {
  const n = rollExpr(expr);
  g.hp -= n;
  g.carry.push(`<p><span class="dmg">― ${reason}：HP −${n}</span></p>`);
  g.log.push(`<span class="ng">負傷 −${n}</span>`);
  flashRed(); glitch(350);
  updateSheet();
  if (g.hp <= 0) throw DEAD;
}
function heal(expr) {
  const n = Math.min(rollExpr(expr), g.mhp - g.hp);
  g.hp += n;
  g.carry.push(`<p><span class="dmg" style="color:#1f3a7a">― 応急手当：HP +${n}</span></p>`);
  updateSheet();
}

      `${V("「あれは　わたしの声を　おぼえた」")}`,
      `調査員の行方は、現在も判明していない。`,
      `なお、捜索打ち切り後も、八重樫山の登山者から<em>「若い調査員風の人物の声で、名を呼ばれた」</em>という報告が寄せられている。`
    ]
  },
  end_mad: {
    ending: { code: "E", title: "記録者錯乱", stamp: "閲覧禁止" },
    place: "診療記録（抜粋）", time: "1999.12.01",
    text: () => [
      `十一月十六日、樫ノ沢集落の住民が、林道を歩く ${N()} を保護した。`,
      `外傷は軽微。ただし、意思の疎通は困難であった。`,
      `患者は昼夜を問わず、様々な人物の声色で、様々な人名を呼び続けている。母親の声。年配の男性の声。幼い子どもの声。`,
      `手帳には、同じ一文がびっしりと書き込まれていた。`,
      `${V("「こたえなきゃ　こたえなきゃ　こたえなきゃ」")}`,
      `担当医の所見——<span class="redact">　　　　　　　　　　　　　　　　</span>`,
      `<span class="dim">※本記録は調査室長の判断により閲覧禁止とする。</span>`
    ]
  }
};

async function wake() {
  g.flags.woke = true;
  await sanCheck("1", "1d8", "ヒトマネの覚醒");
  return "confront";
}
function finish() {
  if (g.san <= Math.max(15, Math.floor(g.msan * 0.4))) {
    g.carry.push(`<p>山を下りてからも、声は耳の奥で鳴り止まなかった。</p>`);
    return "end_mad";
  }
  if (g.flags.footage && (g.flags.sample || g.flags.camera)) return "end_true";
  return "end_unknown";
}

/* ================= 進行エンジン ================= */
let busy = false;
function goto(id) {
  if (g.hp <= 0) id = "end_lost";
  else if (g.san <= 0) id = "end_mad";
  g.scene = id;
  render(id);
  glitch(260);
  const top = paper.getBoundingClientRect().top + window.scrollY - 70;
  if (window.scrollY > top) window.scrollTo({ top, behavior: reduceMotion ? "auto" : "smooth" });
}
async function choose(c, btns) {
  if (busy) return;
  busy = true;
  btns.forEach((b) => (b.disabled = true));
  if (c.id) g.done[c.id] = true;
  let next;
  try { next = await c.run(); }
  catch (e) { if (e !== DEAD) throw e; next = g.hp <= 0 ? "end_lost" : "end_mad"; }
  busy = false;
  goto(next || g.scene);
}
const val = (v) => (typeof v === "function" ? v() : v);

function header(s, idx) {
  return `
    <div class="clip"></div>
    <span class="stamp secret">極秘</span>
    <div class="file-head"><span class="place">${val(s.place)}</span><span>FILE 0347-${s.code || idx}</span></div>
    <div class="file-sub"><span>記録日時：${val(s.time)}</span><span>調査員：${g ? g.nameH : "―"}</span></div>`;
}
function carryHtml(label = "手帳の記録") {
  if (!g.carry.length) return "";
  const h = `<div class="carry" aria-label="${label}">${g.carry.join("")}</div>`;
  g.carry = [];
  return h;
}
function render(id) {
  const s = SCENES[id];
  if (s.ending) return renderEnding(s);
  let html = header(s);
  html += carryHtml();
  const lines = s.text();
  if (s.footage) {
    html += `<div class="footage"><div class="f-osd"><span><span class="dot">●</span> PLAY</span><span>${s.footage.date}　${s.footage.time}</span></div>
      ${lines.map((l, i) => `<p style="animation:inkin .5s ${i * 0.35}s both">${l}</p>`).join("")}</div><div class="body"></div>`;
  } else {
    html += `<div class="body">${lines.map((l, i) => `<p style="animation-delay:${i * 0.18}s">${l}</p>`).join("")}</div>`;
  }
  const list = s.choices().filter((c) => (c.if === undefined || c.if) && !(c.once && g.done[c.id]));
  html += `<ul class="choices">${list.map((c, i) => {
    let tag = "";
    if (c.skill) {
      const mod = c.mod ? c.mod() : 0;
      const t = Math.max(1, Math.min(95, g.sk[c.skill] + mod));
      tag = `<span class="tag">〔${c.skill} ${t}%〕</span>`;
    } else if (c.auto) tag = `<span class="tag auto">〔判定なし〕</span>`;
    return `<li style="animation-delay:${(lines.length * 0.18 + i * 0.1).toFixed(2)}s"><button data-i="${i}">${c.label}${tag}</button></li>`;
  }).join("")}</ul>`;
  paper.innerHTML = html;
  const btns = [...paper.querySelectorAll(".choices button")];
  btns.forEach((b) => (b.onclick = () => choose(list[+b.dataset.i], btns)));
}

const ENDINGS = { A: "確証", B: "沈黙の協定", C: "真偽不明", D: "調査員消息不明", E: "記録者錯乱" };
function renderEnding(s) {
  const e = s.ending;
  const seen = store.get("cryptid0347_endings", {});
  seen[e.code] = true;
  store.set("cryptid0347_endings", seen);
  const ev = Object.keys(CLUES).filter((k) => g.flags[k]).map((k) => CLUES[k]);
  let html = header({ ...s, code: "END-" + e.code });
  html += carryHtml("最後の記録");
  html += `<div class="end-stamp"><span class="stamp big ${e.code === "A" || e.code === "B" ? "blue" : ""}">${e.stamp}</span></div>`;
  html += `<div class="body"><p class="c"><span class="field">ENDING ${e.code}</span><br><strong style="font-size:1.4em;letter-spacing:.2em">${e.title}</strong></p>`;
  html += s.text().map((l, i) => `<p style="animation-delay:${i * 0.3}s">${l}</p>`).join("") + `</div>`;
  html += `<div class="summary"><h3>― 調査結果 ―</h3><table>
    <tr><td>調査員</td><td>${g.nameH}（${g.job}）</td></tr>
    <tr><td>最終状態</td><td>HP ${Math.max(0, g.hp)}/${g.mhp}　SAN ${Math.max(0, g.san)}/${g.msan}</td></tr>
    <tr><td>技能判定</td><td>${g.checks}回中 ${g.wins}回成功</td></tr>
    <tr><td>入手情報</td><td>${ev.length ? ev.join("<br>") : "なし"}</td></tr>
    </table>
    <h3 style="margin-top:12px">― 保管済みファイル ${Object.keys(seen).length} / 5 ―</h3>
    <div class="archive">${Object.entries(ENDINGS).map(([k, v]) => `<span class="${seen[k] ? "got" : ""}">${k}：${seen[k] ? v : "？？？"}</span>`).join("")}</div>
  </div>
  <div class="btn-row"><button class="btn" id="again">同じ探索者で再調査</button><button class="btn ghost" id="fresh">新しい探索者を登録</button></div>`;
  paper.innerHTML = html;
  glitch(900);
  $("#again").onclick = () => { newGame(); goto("intro"); };
  $("#fresh").onclick = () => { g = null; prevHp = prevSan = null; updateSheet(); document.body.classList.remove("unstable"); renderCreate(); };
}

/* ================= 探索者登録 ================= */
function renderCreate() {
  const b = draft.base;
  const job = JOBS[draft.job];
  paper.innerHTML = `
    <div class="clip"></div>
    <span class="stamp secret">極秘</span>
    <div class="file-head"><span class="place">未確認生物調査記録 第0347号</span><span>FORM-7 探索者登録票</span></div>
    <div class="file-sub"><span>民俗生物調査室</span><span>1999.11.12 受付</span></div>
    <div class="body">
      <p>山奥で目撃された「人の声を真似る」謎の生物の調査に、あなたは探索者として派遣される。以下の登録票に記入せよ。</p>
    </div>
    <div class="form-row"><label for="f-name">氏名</label><input type="text" id="f-name" maxlength="16" value="${esc(draft.name)}" autocomplete="off"></div>
    <div class="form-row"><label>職業</label><div class="jobs">
      ${Object.entries(JOBS).map(([k, j]) => `<label><input type="radio" name="job" value="${k}" ${k === draft.job ? "checked" : ""}>${j.name}<small>${j.desc}</small></label>`).join("")}
    </div></div>
    <div class="form-row" style="display:block"><label>能力値</label>
      <div class="stat-grid" style="margin-top:6px">
        <div><span>耐久力 HP</span><b>${b.hp}</b></div>
        <div><span>正気度 SAN</span><b>${b.san}</b></div>
        ${SKILLS.map((k) => `<div><span>${k}</span><b>${Math.min(90, b.sk[k] + (job.bonus[k] || 0))}</b></div>`).join("")}
      </div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="reroll">能力値を振り直す</button>
      <button class="btn" id="start">調査ファイルを開く</button>
    </div>
    <div class="rules">
      <strong>判定のルール</strong><br>
      ・技能判定は <b>1D100</b> を振り、技能値以下なら成功。01〜05は決定的成功、96〜00は致命的失敗。<br>
      ・恐ろしいものを見ると<b>正気度ロール</b>（現在SAN以下で成功）。失敗すると大きく正気度を失う。<br>
      ・HPが0になれば消息不明、SANが0になれば錯乱。エンディングは全5種。
    </div>`;
  const nameEl = $("#f-name");
  nameEl.oninput = () => (draft.name = nameEl.value);
  paper.querySelectorAll("input[name=job]").forEach((r) => (r.onchange = () => { draft.job = r.value; renderCreate(); }));
  $("#reroll").onclick = () => { draft.base = rollBase(); glitch(250); renderCreate(); };
  $("#start").onclick = () => {
    draft.name = nameEl.value.trim() || "名無しの調査員";
    newGame();
    goto("intro");
  };
}

updateSheet();
renderCreate();
</script>
</body>
</html>
