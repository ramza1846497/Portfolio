<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>Blade Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
/* Layout: full-screen WebGL hunting ground, HUD pinned to the corners, touch controls in the thumb zones */
:root {
  --bg: #14110d;
  --ink: #f1e6cf;
  --dim: #b9a888;
  --bronze: #c99a4b;
  --hp: #79b84a;
  --boss: #b8432c;
  --hurt: #c8432f;
  --panel: rgba(22, 17, 12, 0.74);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body);
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

#hud {
  position: fixed; inset: 0 0 auto 0; pointer-events: none;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-right, 0px) + 16px) 0 calc(env(safe-area-inset-left, 0px) + 16px);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  font-family: var(--display);
}
#hpBox { display: grid; gap: 5px; width: min(42vw, 260px); }
.label { font-size: 12px; letter-spacing: 0.14em; color: var(--dim); text-shadow: 0 1px 2px #000; }
.bar { height: 9px; background: rgba(0, 0, 0, 0.55); border: 1px solid var(--bronze); border-radius: 1px; overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6); }
.bar > div { height: 100%; width: 100%; transition: width 0.15s; }
#hpBar { background: linear-gradient(var(--hp), #4e8a2c); }
#hpBar.low { background: linear-gradient(var(--hurt), #8a2a1c); }
#stats { text-align: right; display: grid; gap: 2px; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
#score { font-size: 26px; font-weight: 800; line-height: 1; }
#chain { font-size: 17px; font-weight: 800; color: var(--bronze); min-height: 22px; }

#bossBox { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 64px);
  width: min(70vw, 360px); display: grid; gap: 4px; pointer-events: none; text-align: center; font-family: var(--display); }
@media (orientation: landscape) and (min-width: 700px) {
  #bossBox { top: calc(env(safe-area-inset-top, 0px) + 14px); width: min(36vw, 320px); }
}
#bossName { font-size: 14px; letter-spacing: 0.2em; color: var(--ink); text-shadow: 0 1px 3px #000; }
#bossBar { background: linear-gradient(var(--boss), #6e1f12); }

#banner {
  position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; padding: 0 16px;
  font-family: var(--display); font-weight: 800; font-size: clamp(28px, 8vw, 56px); letter-spacing: 0.12em;
  color: var(--ink); text-shadow: 0 2px 0 #000, 0 0 30px rgba(201, 154, 75, 0.7); opacity: 0;
}
#banner small { display: block; font-size: 0.42em; letter-spacing: 0.3em; color: var(--bronze); margin-top: 6px; }
#banner.show { animation: bannerIn 2.2s ease-out forwards; }
@keyframes bannerIn {
  0% { opacity: 0; transform: scale(1.25); filter: blur(6px); }
  12% { opacity: 1; transform: scale(1); filter: blur(0); }
  78% { opacity: 1; }
  100% { opacity: 0; }
}
#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(140, 20, 10, 0.6) 100%); }
#vignette { position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%); }

#stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 2px solid rgba(201, 154, 75, 0.55); background: rgba(22, 17, 12, 0.35); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e8c88a, var(--bronze) 60%, #7a5a26); }

#buttons {
  position: fixed; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  width: 210px; height: 190px;
}
#buttons button {
  position: absolute; border-radius: 50%; border: 2px solid var(--bronze);
  background: radial-gradient(circle at 50% 35%, rgba(60, 46, 30, 0.85), rgba(16, 12, 8, 0.85));
  color: var(--ink); font-family: var(--display); font-weight: 800; touch-action: none; padding: 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 0 0 3px rgba(0, 0, 0, 0.4);
}
#buttons button.on { background: radial-gradient(circle, rgba(201, 154, 75, 0.85), rgba(110, 80, 34, 0.9)); }
#btnAtk { width: 96px; height: 96px; right: 0; bottom: 0; font-size: 24px; }
#btnJump { width: 64px; height: 64px; right: 104px; bottom: 0; font-size: 16px; }
#btnDash { width: 64px; height: 64px; right: 16px; bottom: 108px; font-size: 16px; }
#btnDash.cd { opacity: 0.4; }

#hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
  font-size: 12px; color: var(--dim); pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }

#overlay {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow-y: auto;
  background: linear-gradient(rgba(20, 17, 13, 0.15), rgba(20, 17, 13, 0.7));
}
.card { width: min(100%, 440px); display: grid; gap: 14px; text-align: center; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(40px, 11vw, 60px); letter-spacing: 0.1em;
  line-height: 1.05; text-wrap: balance; text-shadow: 0 3px 0 #000, 0 0 40px rgba(201, 154, 75, 0.45); }
.card h1 small { display: block; font-size: 0.3em; letter-spacing: 0.5em; color: var(--bronze); margin-top: 8px; }
.card p { margin: 0; color: var(--ink); line-height: 1.7; font-size: 14px; text-shadow: 0 1px 3px #000; }
.card .result { font-family: var(--display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: left; font-size: 13px; margin: 0;
  background: var(--panel); padding: 12px 16px; border: 1px solid rgba(201, 154, 75, 0.45); }
.controls dt { font-family: var(--display); color: var(--bronze); }
.controls dd { margin: 0; color: var(--dim); }
#startBtn { justify-self: center; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.3em;
  padding: 12px 36px 12px 42px; border: 2px solid var(--bronze); background: rgba(22, 17, 12, 0.8); color: var(--ink); cursor: pointer;
  box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.5); }
#startBtn:hover, #startBtn:focus-visible { background: rgba(201, 154, 75, 0.3); outline: none; }
#error { color: var(--hurt); }
#loading { font-family: var(--display); color: var(--dim); letter-spacing: 0.2em; }
@media (max-height: 520px) and (orientation: landscape) {
  .card { width: min(100%, 780px); grid-template-columns: 1fr 1fr; align-items: center; column-gap: 24px; }
  .card > :not(.controls) { grid-column: 1; }
  .card .controls { grid-column: 2; grid-row: 1 / span 6; }
  .card h1 { font-size: 40px; }
}
@media (prefers-reduced-motion: reduce) { #banner.show { animation-duration: 0.01s; opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="hud" hidden>
  <div id="hpBox">
    <div class="label">体力</div>
    <div class="bar"><div id="hpBar"></div></div>
    <div class="label" id="waveLabel">WAVE 1</div>
  </div>
  <div id="stats">
    <div class="label">SCORE</div>
    <div id="score">0</div>
    <div id="chain"></div>
  </div>
</div>
<div id="bossBox" hidden>
  <div id="bossName">炎鱗竜 ヴァルガ</div>
  <div class="bar"><div id="bossBar"></div></div>
</div>
<div id="banner"></div>
<div id="hurt"></div>
<div id="stick" hidden><div id="knob"></div></div>
<div id="buttons" hidden>
  <button id="btnDash" type="button">回避</button>
  <button id="btnJump" type="button">跳躍</button>
  <button id="btnAtk" type="button">斬</button>
</div>
<div id="hint" hidden>WASD 移動 · J/クリック 攻撃 · Space ジャンプ · Shift 回避 · Q/E・ドラッグ 視点</div>

<div id="overlay">
  <div class="card">
    <h1>BLADE ARENA<small>狩 猟 闘 技 場</small></h1>
    <p id="msg">大剣を手に、闘技場へ押し寄せる竜を狩れ。3ウェーブごとに大型の飛竜が舞い降りる。</p>
    <div class="result" id="result" hidden></div>
    <dl class="controls" id="controls">
      <dt>左側をドラッグ</dt><dd>移動（バーチャルスティック）</dd>
      <dt>右側をドラッグ</dt><dd>カメラを回す</dd>
      <dt>斬</dt><dd>大剣の3段コンボ。3段目は回転斬り</dd>
      <dt>回避</dt><dd>無敵の前転。攻撃中でも出せる</dd>
      <dt>跳躍</dt><dd>突進や尻尾をかわす</dd>
    </dl>
    <div id="loading">LOADING…</div>
    <button id="startBtn" type="button" hidden>狩猟開始</button>
    <p id="error" hidden></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);

if (typeof THREE === 'undefined') {
  $('error').hidden = false;
  $('error').textContent = '3Dライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。';
  $('loading').hidden = true;
  return;
}

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const TAU = Math.PI * 2;
const ARENA_R = 24;
const Y_UP = new THREE.Vector3(0, 1, 0);

// ---------- renderer / scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const ANISO = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 700);

// ---------- procedural noise ----------
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoiseT(x, y, p) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = ((ix % p) + p) % p, y0 = ((iy % p) + p) % p, x1 = (x0 + 1) % p, y1 = (y0 + 1) % p;
  const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbmT(x, y, p, oct) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoiseT(x * f, y * f, p * f); n += a; f *= 2; a *= 0.5; }
  return s / n;
}
function vnoise(x, y) { return vnoiseT(x, y, 1e6); }
function fbm(x, y, oct) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); n += a; f *= 2; a *= 0.5; } return s / n; }
const W = { f1: 0, f2: 0, id: 0 };
function worleyT(x, y, p) {
  const ix = Math.floor(x), iy = Math.floor(y);
  W.f1 = W.f2 = 9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = ix + dx, cy = iy + dy, wx = ((cx % p) + p) % p, wy = ((cy % p) + p) % p;
    const px = cx + 0.15 + 0.7 * hash2(wx + 11.3, wy), py = cy + 0.15 + 0.7 * hash2(wx, wy + 17.9);
    const d = Math.hypot(x - px, y - py);
    if (d < W.f1) { W.f2 = W.f1; W.f1 = d; W.id = hash2(wx * 3.1, wy * 1.7); } else if (d < W.f2) W.f2 = d;
  }
  return W;
}
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// Paints a tileable colour map and derives a matching normal map from the height channel.
function genTex(size, repeat, normalStrength, fn) {
  const cc = document.createElement('canvas'); cc.width = cc.height = size;
  const ctx = cc.getContext('2d'), img = ctx.createImageData(size, size), H = new Float32Array(size * size);
  const o = { r: 0, g: 0, b: 0, h: 0 };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    fn(x / size, y / size, o);
    const i = y * size + x;
    img.data[i * 4] = Math.min(255, o.r * 255); img.data[i * 4 + 1] = Math.min(255, o.g * 255);
    img.data[i * 4 + 2] = Math.min(255, o.b * 255); img.data[i * 4 + 3] = 255;
    H[i] = o.h;
  }
  ctx.putImageData(img, 0, 0);
  const nc = document.createElement('canvas'); nc.width = nc.height = size;
  const nctx = nc.getContext('2d'), nimg = nctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const l = H[y * size + (x - 1 + size) % size], r = H[y * size + (x + 1) % size];
    const u = H[((y - 1 + size) % size) * size + x], d = H[((y + 1) % size) * size + x];
    let nx = -(r - l) * normalStrength, ny = (d - u) * normalStrength, nz = 1;
    const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
    const i = (y * size + x) * 4;
    nimg.data[i] = (nx * 0.5 + 0.5) * 255; nimg.data[i + 1] = (ny * 0.5 + 0.5) * 255; nimg.data[i + 2] = (nz * 0.5 + 0.5) * 255; nimg.data[i + 3] = 255;
  }
  nctx.putImageData(nimg, 0, 0);
  const map = new THREE.CanvasTexture(cc), normalMap = new THREE.CanvasTexture(nc);
  map.encoding = THREE.sRGBEncoding;
  for (const t of [map, normalMap]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = ANISO; }
  return { map, normalMap };
}
function withRepeat(tex, rx, ry) {
  const out = {};
  for (const k in tex) { out[k] = tex[k].clone(); out[k].needsUpdate = true; out[k].repeat.set(rx, ry); }
  return out;
}

const TEX = {};
function buildTextures() {
  TEX.ground = genTex(isTouch ? 256 : 512, 1, 6, (u, v, o) => {
    const n = fbmT(u * 8, v * 8, 8, 5), m = fbmT(u * 4 + 3, v * 4 + 1, 4, 3), grit = hash2((u * 512) | 0, (v * 512) | 0);
    const g = smooth(0.48, 0.66, m) * 0.75;
    const k = 0.82 + grit * 0.3;
    o.r = ((0.40 - n * 0.16) * (1 - g) + 0.36 * g) * k;
    o.g = ((0.31 - n * 0.12) * (1 - g) + 0.35 * g) * k;
    o.b = ((0.21 - n * 0.09) * (1 - g) + 0.17 * g) * k;
    o.h = n + grit * 0.12;
  });
  TEX.rock = genTex(256, 1, 9, (u, v, o) => {
    const n = fbmT(u * 6, v * 6, 6, 5), s = fbmT(u * 2, v * 16, 2, 3), w = worleyT(u * 9, v * 9, 9);
    const crack = smooth(0.0, 0.05, w.f2 - w.f1);
    const k = (0.6 + n * 0.5) * (0.85 + 0.15 * crack) * (0.9 + s * 0.2);
    o.r = 0.52 * k; o.g = 0.45 * k; o.b = 0.37 * k;
    o.h = n * 0.9 + crack * 0.25 + s * 0.25;
  });
  TEX.scales = genTex(256, 1, 7, (u, v, o) => {
    const w = worleyT(u * 16, v * 16, 16), edge = smooth(0.0, 0.22, w.f2 - w.f1), n = fbmT(u * 8, v * 8, 8, 3);
    const plate = edge * (0.75 + 0.25 * w.id);
    const k = 0.5 + plate * 0.42 + n * 0.12 + w.id * 0.08;
    o.r = k; o.g = k * 0.97; o.b = k * 0.93;
    o.h = plate + n * 0.2;
  });
  TEX.membrane = genTex(256, 1, 4, (u, v, o) => {
    const n = fbmT(u * 6, v * 6, 6, 4);
    const vein = Math.pow(Math.abs(Math.sin((u * 7 + n * 1.5) * Math.PI)), 18) + Math.pow(Math.abs(Math.sin((v * 5 + n * 2.2) * Math.PI)), 30) * 0.6;
    const k = 0.78 + n * 0.25 - Math.min(vein, 1) * 0.35;
    o.r = k; o.g = k * 0.95; o.b = k * 0.92;
    o.h = Math.min(vein, 1) + n * 0.3;
  });
  TEX.metal = genTex(128, 1, 2, (u, v, o) => {
    const n = fbmT(u * 2, v * 32, 2, 4), d = fbmT(u * 8, v * 8, 8, 3);
    const k = 0.82 + n * 0.18 - smooth(0.6, 0.8, d) * 0.15;
    o.r = o.g = o.b = k; o.h = n * 0.5 + d * 0.3;
  });
  TEX.leather = genTex(128, 1, 5, (u, v, o) => {
    const n = fbmT(u * 10, v * 10, 10, 4), w = worleyT(u * 12, v * 12, 12);
    const k = 0.7 + n * 0.3 - (1 - smooth(0, 0.1, w.f2 - w.f1)) * 0.15;
    o.r = o.g = o.b = k; o.h = n + smooth(0, 0.1, w.f2 - w.f1) * 0.3;
  });
}

// ---------- sky / lighting ----------
const SUN_DIR = new THREE.Vector3(-0.55, 0.36, -0.75).normalize();
const skyUniforms = {
  top: { value: new THREE.Color(0x2c4468) }, horizon: { value: new THREE.Color(0xe0a066) },
  bottom: { value: new THREE.Color(0x4a3a2c) }, sunDir: { value: SUN_DIR },
};
function makeSky(radius) {
  return new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 16), new THREE.ShaderMaterial({
    uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: [
      'uniform vec3 top; uniform vec3 horizon; uniform vec3 bottom; uniform vec3 sunDir; varying vec3 vDir;',
      'void main(){',
      '  float h = vDir.y;',
      '  vec3 col = mix(horizon, top, pow(clamp(h, 0.0, 1.0), 0.55));',
      '  col = mix(col, bottom, smoothstep(0.0, -0.25, h));',
      '  float s = max(dot(normalize(vDir), sunDir), 0.0);',
      '  col += vec3(1.0, 0.62, 0.32) * pow(s, 6.0) * 0.45 + vec3(1.0, 0.85, 0.6) * pow(s, 300.0) * 3.0;',
      '  float band = exp(-abs(h - 0.04) * 22.0);',
      '  col = mix(col, vec3(0.95, 0.66, 0.45), band * 0.25);',
      '  gl_FragColor = vec4(col, 1.0);',
      '}',
    ].join('\n'),
  }));
}
const sky = makeSky(600);
scene.add(sky);
const fogColor = new THREE.Color(0xb98a62).convertSRGBToLinear();
scene.fog = new THREE.Fog(fogColor, 30, 170);

const hemi = new THREE.HemisphereLight(0x9db4d6, 0x5c4630, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffd0a0, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 140 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// Sky-coloured cube map for reflections, painted on canvases (works on GPUs without float render targets).
function skyColor(x, y, z) {
  const len = Math.hypot(x, y, z), h = y / len;
  const top = [0x2c / 255, 0x44 / 255, 0x68 / 255], hor = [0xe0 / 255, 0xa0 / 255, 0x66 / 255], bot = [0x4a / 255, 0x3a / 255, 0x2c / 255];
  const k = Math.pow(Math.max(h, 0), 0.55), g = smooth(0, -0.25, h);
  const s = Math.max((x * SUN_DIR.x + y * SUN_DIR.y + z * SUN_DIR.z) / len, 0), glow = Math.pow(s, 6) * 0.45;
  return [0, 1, 2].map((i) => Math.min(1, lerp(lerp(hor[i], top[i], k), bot[i], g) + [1, 0.62, 0.32][i] * glow));

function buildEnvironmentMap() {

  R.body.position.y = lerp(R.body.position.y, down ? -R.lieDrop * 0.8 : 0, k(down ? 4 : 2.5));
  // heavy footfalls
  if (amp > 0.2 && !down && Math.sign(w) !== e.stepSign) {
    e.stepSign = Math.sign(w);
    dustPuff(e.pos.x + Math.cos(e.facing) * e.stepSign * 1.1, e.pos.z - Math.sin(e.facing) * e.stepSign * 1.1, 3, 2);
    const d = Math.hypot(P.pos.x - e.pos.x, P.pos.z - e.pos.z);
    if (d < 14 && state === 'play') shake = Math.max(shake, 0.12 * (1 - d / 14) * Math.min(amp, 1));
  }
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], t = e.t;
    e.time += dt;
    e.flash -= dt;
    e.cooldown -= dt;
    const dx = P.pos.x - e.pos.x, dz = P.pos.z - e.pos.z, dist = Math.hypot(dx, dz) || 1;
    const toP = Math.atan2(dx, dz);
    e.toRel = angDiff(toP, e.facing);
    const prevFacing = e.facing;
    if (t.boss) wyvernAI(e, dt, dist, toP); else raptorAI(e, dt, dist, toP);

    if (e.state === 'dead') {
      e.speed = lerp(e.speed, 0, damp(6, dt));
      const R = e.rig, k = Math.min(e.time / 0.6, 1);
      R.body.rotation.z = e.fallDir * 1.45 * k * k;
      R.body.position.y = -R.lieDrop * k * k;
      e.pos.y = Math.max(0, e.pos.y - dt * 6);
      if (e.time > (t.boss ? 6 : 2.5)) R.root.position.y -= dt * 0.8;
      if (e.time > (t.boss ? 8 : 4)) { removeEnemy(e); enemies.splice(i, 1); continue; }
    } else {
      // locomotion with inertia
      if (e.accel > 0) e.speed += (e.wantSpeed - e.speed) * damp(e.accel, dt);
      e.strafe += (e.wantStrafe - e.strafe) * damp(6, dt);
    }
    const sf = Math.sin(e.facing), cf = Math.cos(e.facing);
    e.pos.x += (sf * e.speed + cf * e.strafe) * dt;
    e.pos.z += (cf * e.speed - sf * e.strafe) * dt;
    e.pos.addScaledVector(e.kb, dt);
    e.kb.multiplyScalar(Math.exp(-7 * dt));
    e.turnVel = lerp(e.turnVel, angDiff(e.facing, prevFacing) / Math.max(dt, 1e-4), damp(10, dt));
    // hit recoil: a damped spring kicked by each blow
    e.recoilV += (-140 * e.recoil - 14 * e.recoilV) * dt;
    e.recoil += e.recoilV * dt;
    e.moveSpeed = lerp(e.moveSpeed, Math.hypot(e.pos.x - e.last.x, e.pos.z - e.last.z) / Math.max(dt, 1e-4), damp(10, dt));
    e.last.copy(e.pos);

    if (e.flash > 0) e.rig.skin.emissive.setRGB(0.45, 0.16, 0.06);
    else e.rig.skin.emissive.setRGB(0, 0, 0);

    if (e.state !== 'dead') {
      e.rig.root.position.copy(e.pos);
      if (t.boss) animateWyvern(e, dt); else animateRaptor(e, dt);
    }
    e.rig.root.rotation.y = e.facing;
  }
  // keep monsters from stacking on each other or the hunter
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (a.state === 'dead' || a.state === 'land') continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.state === 'dead' || b.state === 'land') continue;
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = a.t.r + b.t.r;
      if (d < min && d > 1e-4) {
        const wa = b.t.r / min, wb = a.t.r / min, push = min - d;
        a.pos.x -= dx / d * push * wa; a.pos.z -= dz / d * push * wa;
        b.pos.x += dx / d * push * wb; b.pos.z += dz / d * push * wb;
      }
    }
    const dx = a.pos.x - P.pos.x, dz = a.pos.z - P.pos.z, d = Math.hypot(dx, dz), min = a.t.r + P.r;
    if (d < min && d > 1e-4 && Math.abs(P.pos.y - a.pos.y) < 1.5) {
      if (a.t.boss) { P.pos.x = a.pos.x - dx / d * min; P.pos.z = a.pos.z - dz / d * min; }
      else { a.pos.x = P.pos.x + dx / d * min; a.pos.z = P.pos.z + dz / d * min; }
    }
    collideWorld(a.pos, a.t.r);
  }
}

function updateWaves(dt) {
  if (phase === 'fight') {
    if (spawnQueue.length) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(spawnQueue.shift()); spawnTimer = 0.7; }
    } else if (!enemies.some((e) => e.state !== 'dead')) {
      phase = 'intermission';
      phaseTimer = 3.2;
      if (wave > 0) {
        P.hp = Math.min(P.maxHp, P.hp + 40);
        score += wave * 50;
        if (wave % 3 !== 0) banner('WAVE CLEAR');
      }
    }
  } else if (phase === 'intermission') {
    phaseTimer -= dt;
    if (phaseTimer <= 0) nextWave();
  }
}

let camTime = 0, baseFov = 55;
function updateCamera(realDt) {
  camTime += realDt;
  const portrait = camera.aspect < 1;
  const bossNear = enemies.some((e) => e.t.boss && e.state !== 'dead' && e.state !== 'display');
  const dist = (portrait ? 12 : 9) + (bossNear ? 3 : 0);
  // follow a point slightly ahead of the hunter so the view leads the movement
  let tx = P.pos.x + Math.sin(P.facing) * P.speed * 0.2, ty = 1.4 + P.pos.y * 0.4, tz = P.pos.z + Math.cos(P.facing) * P.speed * 0.2;
  if (state === 'title' || state === 'loading') { tx = 0; ty = 3.4; tz = -2; }
  camTarget.x += (tx - camTarget.x) * damp(5, realDt);
  camTarget.z += (tz - camTarget.z) * damp(5, realDt);
  camTarget.y += (ty - camTarget.y) * damp(4, realDt);
  e_dist = lerp(e_dist, state === 'title' ? 13 : dist, damp(2.5, realDt));
  camera.position.set(
    camTarget.x + Math.sin(yaw) * Math.cos(pitch) * e_dist,
    camTarget.y + Math.sin(pitch) * e_dist,
    camTarget.z + Math.cos(yaw) * Math.cos(pitch) * e_dist
  );
  _v.copy(camTarget);
  if (shake > 0) {
    // smooth, decaying shake instead of per-frame jitter
    const a = shake * shake * 2.2;
    const ox = (Math.sin(camTime * 47) + Math.sin(camTime * 31.7) * 0.6) * a, oy = (Math.sin(camTime * 53.3) + Math.sin(camTime * 23.1) * 0.6) * a;
    camera.position.x += ox; camera.position.y += oy;
    _v.x += ox * 0.4; _v.y += oy * 0.4;
    shake = Math.max(0, shake - realDt * 1.5);
  }
  camera.lookAt(_v);
  const wantFov = baseFov + (P.actName === 'roll' && P.act ? 4 : 0) + (P.act && P.act.spin ? 2 : 0);
  if (Math.abs(camera.fov - wantFov) > 0.01) { camera.fov = lerp(camera.fov, wantFov, damp(6, realDt)); camera.updateProjectionMatrix(); }
  sky.position.copy(camera.position);
  sun.position.set(camTarget.x + SUN_DIR.x * 60, SUN_DIR.y * 60, camTarget.z + SUN_DIR.z * 60);
  sun.target.position.set(camTarget.x, 0, camTarget.z);
}
let e_dist = 13;

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  baseFov = camera.aspect < 1 ? 70 : 55;
  camera.fov = baseFov;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min((now - last) / 1000, 0.05);
  last = now;
  let dt = realDt;
  if (hitstop > 0) { hitstop -= realDt; dt *= 0.05; }
  time += dt;
  grassUniform.value = time;

  if (state === 'play' || state === 'over') {
    updatePlayer(dt);
    if (state === 'play') updateWaves(dt);
    updateEnemies(dt);
    chainTimer -= dt;
    if (chainTimer <= 0) chain = 0;
    updateHud();
  } else if (state === 'title') {
    yaw = Math.PI * 0.15 + Math.sin(time * 0.12) * 0.6;
    pitch = 0.16;
    updateEnemies(dt);
    computeLoco(dt);
    Object.assign(P.pose, P.loco);
    PM.root.position.copy(P.pos);
    PM.model.rotation.y = P.facing;
    applyPose(P.pose);
  }
  if (dust) {
    dust.position.set(camTarget.x, 0, camTarget.z);
    dust.rotation.y = time * 0.02;
  }
  updateParts(dt);
  updateClouds(dt);
  updateTrail(dt, !!(P.act && P.act.trail && P.actT >= P.act.trail[0] && P.actT <= P.act.trail[1]));
  updateCamera(realDt);
  renderer.render(scene, camera);
}

// build everything after the loading text has painted
requestAnimationFrame(() => setTimeout(() => {
  try {
    buildTextures();
    buildEnvironmentMap();
    buildWorld();
    PM = makeHunter();
    P.pos.set(0, 0, 6);
    spawnEnemy('wyvern', { display: true });
    bossCount = 0;
    state = 'title';
    $('loading').hidden = true;
    $('startBtn').hidden = false;
    requestAnimationFrame(frame);
  } catch (err) {
    $('loading').hidden = true;
    $('error').hidden = false;
    $('error').textContent = '3D表示の初期化に失敗しました（' + err.message + '）。';
  }
}, 30));
})();
</script>
</body>
</html>
