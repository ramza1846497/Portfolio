<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14110d">
<title>Blade Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap">
<style>
/* Layout: full-screen open world; vitals and goal top-left, map top-right, actions in the right thumb zone */
:root {
  --bg: #14110d;
  --ink: #f1e6cf;
  --dim: #b9a888;
  --bronze: #c99a4b;
  --hp: #79b84a;
  --boss: #b8432c;
  --hurt: #c8432f;
  --ok: #8fc46a;
  --panel: rgba(22, 17, 12, 0.86);
  --display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
  --body: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
body {
  font-family: var(--body);
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%); }

#hud { position: fixed; inset: 0; pointer-events: none; font-family: var(--display); }
#vitals { position: absolute; left: calc(env(safe-area-inset-left, 0px) + 16px); top: calc(env(safe-area-inset-top, 0px) + 12px);
  width: min(44vw, 270px); display: grid; gap: 5px; }
.label { font-size: 12px; letter-spacing: 0.14em; color: var(--dim); text-shadow: 0 1px 2px #000; }
.bar { height: 9px; background: rgba(0, 0, 0, 0.55); border: 1px solid var(--bronze); overflow: hidden; box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6); }
.bar > div { height: 100%; width: 100%; transition: width 0.15s; }
#hpBar { background: linear-gradient(var(--hp), #4e8a2c); }
#hpBar.low { background: linear-gradient(var(--hurt), #8a2a1c); }
#goal { margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--ink); text-shadow: 0 1px 3px #000;
  background: linear-gradient(90deg, rgba(22, 17, 12, 0.7), transparent); padding: 4px 8px; border-left: 2px solid var(--bronze); }
#goal b { display: block; font-size: 10px; letter-spacing: 0.2em; color: var(--bronze); font-weight: 700; }

#mapWrap { position: absolute; right: calc(env(safe-area-inset-right, 0px) + 14px); top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: grid; justify-items: end; gap: 6px; pointer-events: auto; }
#minimap { width: 112px; height: 112px; border-radius: 50%; border: 2px solid var(--bronze); background: #1d1a14;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.6); }
#btnMenu { font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: 0.12em; color: var(--ink);
  background: var(--panel); border: 1px solid var(--bronze); padding: 6px 12px; touch-action: none; cursor: pointer; }
#area { font-size: 11px; letter-spacing: 0.2em; color: var(--dim); text-shadow: 0 1px 2px #000; text-align: right; }

#toasts { position: fixed; left: calc(env(safe-area-inset-left, 0px) + 16px); top: 42%; display: grid; gap: 4px; pointer-events: none;
  font-family: var(--display); font-size: 14px; }
.toast { background: linear-gradient(90deg, rgba(22, 17, 12, 0.85), transparent); padding: 3px 24px 3px 8px; border-left: 2px solid var(--ok);
  animation: toastIn 2.4s ease-out forwards; text-shadow: 0 1px 2px #000; }
@keyframes toastIn { 0% { opacity: 0; transform: translateX(-12px); } 10% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }

#bossBox { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px);
  width: min(34vw, 300px); display: grid; gap: 4px; pointer-events: none; text-align: center; font-family: var(--display); }
@media (max-width: 700px) { #bossBox { top: calc(env(safe-area-inset-top, 0px) + 140px); width: 60vw; } }
#bossName { font-size: 14px; letter-spacing: 0.2em; text-shadow: 0 1px 3px #000; }
#bossBar { background: linear-gradient(var(--boss), #6e1f12); }

#banner { position: fixed; left: 0; right: 0; top: 30%; text-align: center; pointer-events: none; padding: 0 16px;
  font-family: var(--display); font-weight: 800; font-size: clamp(26px, 7vw, 50px); letter-spacing: 0.12em;
  color: var(--ink); text-shadow: 0 2px 0 #000, 0 0 30px rgba(201, 154, 75, 0.7); opacity: 0; }
#banner small { display: block; font-size: 0.42em; letter-spacing: 0.3em; color: var(--bronze); margin-top: 6px; }
#banner.show { animation: bannerIn 2.4s ease-out forwards; }
@keyframes bannerIn { 0% { opacity: 0; transform: scale(1.2); filter: blur(6px); } 12% { opacity: 1; transform: none; filter: none; } 78% { opacity: 1; } 100% { opacity: 0; } }
#hurt { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(140, 20, 10, 0.6) 100%); }
#fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.8s; }

#stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  border: 2px solid rgba(201, 154, 75, 0.55); background: rgba(22, 17, 12, 0.35); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #e8c88a, var(--bronze) 60%, #7a5a26); }

#buttons { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 18px); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  width: 250px; height: 180px; pointer-events: none; }
.btn { position: absolute; border-radius: 50%; border: 2px solid var(--bronze); pointer-events: auto;
  background: radial-gradient(circle at 50% 35%, rgba(60, 46, 30, 0.88), rgba(16, 12, 8, 0.88));
  color: var(--ink); font-family: var(--display); font-weight: 800; touch-action: none; padding: 0;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5), inset 0 0 0 3px rgba(0, 0, 0, 0.4); }
.btn.on { background: radial-gradient(circle, rgba(201, 154, 75, 0.85), rgba(110, 80, 34, 0.9)); }
#btnAtk { width: 96px; height: 96px; right: 0; bottom: 0; font-size: 24px; }
#btnJump { width: 62px; height: 62px; right: 104px; bottom: 0; font-size: 15px; }
#btnDash { width: 62px; height: 62px; right: 17px; bottom: 106px; font-size: 15px; }
#btnAct { width: 68px; height: 68px; right: 98px; bottom: 74px; font-size: 14px; border-color: var(--ok); }
#btnPotion { width: 54px; height: 54px; right: 176px; bottom: 6px; font-size: 13px; line-height: 1.1; }
#btnPotion small { display: block; font-size: 11px; color: var(--dim); }

#hint { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); transform: translateX(-50%);
  font-size: 12px; color: var(--dim); pointer-events: none; white-space: nowrap; text-shadow: 0 1px 2px #000; }

/* base / inventory panel */
#panel { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 6, 4, 0.55); }
.sheet { width: min(100%, 620px); max-height: calc(100% - 8px); overflow-y: auto; background: var(--panel);
  border: 1px solid var(--bronze); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); padding: 16px; display: grid; gap: 14px;
  touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.sheet header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--display); font-size: 20px; letter-spacing: 0.12em; }
.sheet h3 { margin: 0 0 8px; font-family: var(--display); font-size: 14px; letter-spacing: 0.16em; color: var(--bronze); }
.close { font-family: var(--display); background: transparent; color: var(--ink); border: 1px solid var(--bronze); padding: 6px 14px; cursor: pointer; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 6px; }
.inv div { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 5px 8px; background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(201, 154, 75, 0.2); font-variant-numeric: tabular-nums; }
.inv span { color: var(--dim); }
.rows { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 8px 10px;
  background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(201, 154, 75, 0.2); }
.row .name { font-family: var(--display); font-size: 15px; }
.row .desc { grid-column: 1; font-size: 12px; color: var(--dim); line-height: 1.5; min-width: 0; }
.row .cost { grid-column: 1; font-size: 12px; font-variant-numeric: tabular-nums; }
.row .cost .lack { color: var(--hurt); }
.row .cost .have { color: var(--ok); }
.row button { grid-row: 1 / span 3; grid-column: 2; font-family: var(--display); font-weight: 800; font-size: 14px; color: var(--ink);
  background: rgba(201, 154, 75, 0.25); border: 1px solid var(--bronze); padding: 8px 14px; cursor: pointer; }
.row button:disabled { opacity: 0.35; cursor: default; }
.row.done { opacity: 0.6; }
.locked { font-size: 12px; color: var(--dim); }

#overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; overflow-y: auto;
  background: linear-gradient(rgba(20, 17, 13, 0.15), rgba(20, 17, 13, 0.7)); }
.card { width: min(100%, 460px); display: grid; gap: 14px; text-align: center; }
.card h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(38px, 10vw, 58px); letter-spacing: 0.1em;
  line-height: 1.05; text-wrap: balance; text-shadow: 0 3px 0 #000, 0 0 40px rgba(201, 154, 75, 0.45); }
.card h1 small { display: block; font-size: 0.3em; letter-spacing: 0.5em; color: var(--bronze); margin-top: 8px; }
.card p { margin: 0; line-height: 1.7; font-size: 14px; text-shadow: 0 1px 3px #000; }
.controls { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; text-align: left; font-size: 13px; margin: 0;
  background: var(--panel); padding: 12px 16px; border: 1px solid rgba(201, 154, 75, 0.45); }
.controls dt { font-family: var(--display); color: var(--bronze); }
.controls dd { margin: 0; color: var(--dim); }
.startRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.startRow button { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: 0.2em; padding: 11px 26px;
  border: 2px solid var(--bronze); background: rgba(22, 17, 12, 0.8); color: var(--ink); cursor: pointer; box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.5); }
.startRow button:hover, .startRow button:focus-visible { background: rgba(201, 154, 75, 0.3); outline: none; }
#error { color: var(--hurt); }
#loading { font-family: var(--display); color: var(--dim); letter-spacing: 0.2em; }
@media (max-height: 520px) and (orientation: landscape) {
  .card { width: min(100%, 800px); grid-template-columns: 1fr 1fr; align-items: center; column-gap: 24px; }
  .card > :not(.controls) { grid-column: 1; }
  .card .controls { grid-column: 2; grid-row: 1 / span 6; }
  .card h1 { font-size: 38px; }
}
@media (prefers-reduced-motion: reduce) { #banner.show, .toast { animation-duration: 0.01s; opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>

<div id="hud" hidden>
  <div id="vitals">
    <div class="label">体力</div>
    <div class="bar"><div id="hpBar"></div></div>
    <div id="goal"><b>次の目標</b><span id="goalText"></span></div>
  </div>
  <div id="mapWrap">
    <canvas id="minimap" width="112" height="112"></canvas>
    <div id="area"></div>
    <button id="btnMenu" type="button">持ち物</button>
  </div>
</div>
<div id="toasts"></div>
<div id="bossBox" hidden>
  <div id="bossName">炎鱗竜 ヴァルガ</div>
  <div class="bar"><div id="bossBar"></div></div>
</div>
<div id="banner"></div>
<div id="hurt"></div>
<div id="fade"></div>
<div id="stick" hidden><div id="knob"></div></div>
<div id="buttons" hidden>
  <button class="btn" id="btnDash" type="button">回避</button>
  <button class="btn" id="btnAct" type="button" hidden>採取</button>
  <button class="btn" id="btnPotion" type="button">薬<small id="potionCount">0</small></button>
  <button class="btn" id="btnJump" type="button">跳躍</button>
  <button class="btn" id="btnAtk" type="button">斬</button>
</div>
<div id="hint" hidden>WASD 移動 · J/クリック 攻撃 · Space ジャンプ · Shift 回避 · F 採取/拠点 · R 回復薬 · I 持ち物 · Q/E 視点</div>

<div id="panel" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<div id="overlay">
  <div class="card">
    <h1>BLADE ARENA<small>辺 境 の 狩 人</small></h1>
    <p id="msg">辺境の地に拠点を築き、森で木を伐り、岩山で鉱石を掘り、竜を狩って装備を鍛えよう。目指すは西の巣に棲む炎鱗竜。</p>
    <dl class="controls" id="controls">
      <dt>左側をドラッグ</dt><dd>移動</dd>
      <dt>右側をドラッグ</dt><dd>カメラを回す</dd>
      <dt>斬</dt><dd>攻撃。木や岩を斬ると素材が採れる</dd>
      <dt>採取 / 拠点</dt><dd>薬草を摘む・焚き火で建築や鍛冶</dd>
      <dt>回避・跳躍・薬</dt><dd>前転・ジャンプ・回復薬</dd>
    </dl>
    <div id="loading">LOADING…</div>
    <div class="startRow" id="startRow" hidden>
      <button id="contBtn" type="button" hidden>つづきから</button>
      <button id="newBtn" type="button">はじめから</button>
    </div>
    <p id="error" hidden></p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
const $ = (id) => document.getElementById(id);

if (typeof THREE === 'undefined') {
  $('error').hidden = false;
  $('error').textContent = '3Dライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。';
  $('loading').hidden = true;
  return;
}

const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const TAU = Math.PI * 2;
const Y_UP = new THREE.Vector3(0, 1, 0);

// ---------- renderer / scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const ANISO = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 700);

// ---------- procedural noise ----------
function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoiseT(x, y, p) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const x0 = ((ix % p) + p) % p, y0 = ((iy % p) + p) % p, x1 = (x0 + 1) % p, y1 = (y0 + 1) % p;
  const a = hash2(x0, y0), b = hash2(x1, y0), c = hash2(x0, y1), d = hash2(x1, y1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbmT(x, y, p, oct) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoiseT(x * f, y * f, p * f); n += a; f *= 2; a *= 0.5; }
  return s / n;
}
function vnoise(x, y) { return vnoiseT(x, y, 1e6); }
function fbm(x, y, oct) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f); n += a; f *= 2; a *= 0.5; } return s / n; }
const W = { f1: 0, f2: 0, id: 0 };
function worleyT(x, y, p) {
  const ix = Math.floor(x), iy = Math.floor(y);
  W.f1 = W.f2 = 9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = ix + dx, cy = iy + dy, wx = ((cx % p) + p) % p, wy = ((cy % p) + p) % p;
    const px = cx + 0.15 + 0.7 * hash2(wx + 11.3, wy), py = cy + 0.15 + 0.7 * hash2(wx, wy + 17.9);
    const d = Math.hypot(x - px, y - py);
    if (d < W.f1) { W.f2 = W.f1; W.f1 = d; W.id = hash2(wx * 3.1, wy * 1.7); } else if (d < W.f2) W.f2 = d;
  }
  return W;
}
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

// Paints a tileable colour map and derives a matching normal map from the height channel.
function genTex(size, repeat, normalStrength, fn) {
  const cc = document.createElement('canvas'); cc.width = cc.height = size;
  const ctx = cc.getContext('2d'), img = ctx.createImageData(size, size), H = new Float32Array(size * size);
  const o = { r: 0, g: 0, b: 0, h: 0 };
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    fn(x / size, y / size, o);
    const i = y * size + x;
    img.data[i * 4] = Math.min(255, o.r * 255); img.data[i * 4 + 1] = Math.min(255, o.g * 255);
    img.data[i * 4 + 2] = Math.min(255, o.b * 255); img.data[i * 4 + 3] = 255;
    H[i] = o.h;
  }
  ctx.putImageData(img, 0, 0);
  const nc = document.createElement('canvas'); nc.width = nc.height = size;
  const nctx = nc.getContext('2d'), nimg = nctx.createImageData(size, size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const l = H[y * size + (x - 1 + size) % size], r = H[y * size + (x + 1) % size];
    const u = H[((y - 1 + size) % size) * size + x], d = H[((y + 1) % size) * size + x];
    let nx = -(r - l) * normalStrength, ny = (d - u) * normalStrength, nz = 1;
    const len = Math.hypot(nx, ny, nz); nx /= len; ny /= len; nz /= len;
    const i = (y * size + x) * 4;
    nimg.data[i] = (nx * 0.5 + 0.5) * 255; nimg.data[i + 1] = (ny * 0.5 + 0.5) * 255; nimg.data[i + 2] = (nz * 0.5 + 0.5) * 255; nimg.data[i + 3] = 255;
  }
  nctx.putImageData(nimg, 0, 0);
  const map = new THREE.CanvasTexture(cc), normalMap = new THREE.CanvasTexture(nc);
  map.encoding = THREE.sRGBEncoding;
  for (const t of [map, normalMap]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = ANISO; }
  return { map, normalMap };
}
function withRepeat(tex, rx, ry) {
  const out = {};
  for (const k in tex) { out[k] = tex[k].clone(); out[k].needsUpdate = true; out[k].repeat.set(rx, ry); }
  return out;
}

const TEX = {};
function buildTextures() {
  TEX.ground = genTex(isTouch ? 256 : 512, 1, 6, (u, v, o) => {
    const n = fbmT(u * 8, v * 8, 8, 5), m = fbmT(u * 4 + 3, v * 4 + 1, 4, 3), grit = hash2((u * 512) | 0, (v * 512) | 0);
    const g = smooth(0.48, 0.66, m) * 0.75;
    const k = 0.82 + grit * 0.3;
    o.r = ((0.40 - n * 0.16) * (1 - g) + 0.36 * g) * k;
    o.g = ((0.31 - n * 0.12) * (1 - g) + 0.35 * g) * k;
    o.b = ((0.21 - n * 0.09) * (1 - g) + 0.17 * g) * k;
    o.h = n + grit * 0.12;
  });
  TEX.rock = genTex(256, 1, 9, (u, v, o) => {
    const n = fbmT(u * 6, v * 6, 6, 5), s = fbmT(u * 2, v * 16, 2, 3), w = worleyT(u * 9, v * 9, 9);
    const crack = smooth(0.0, 0.05, w.f2 - w.f1);
    const k = (0.6 + n * 0.5) * (0.85 + 0.15 * crack) * (0.9 + s * 0.2);
    o.r = 0.52 * k; o.g = 0.45 * k; o.b = 0.37 * k;
    o.h = n * 0.9 + crack * 0.25 + s * 0.25;
  });
  TEX.scales = genTex(256, 1, 7, (u, v, o) => {
    const w = worleyT(u * 16, v * 16, 16), edge = smooth(0.0, 0.22, w.f2 - w.f1), n = fbmT(u * 8, v * 8, 8, 3);
    const plate = edge * (0.75 + 0.25 * w.id);
    const k = 0.5 + plate * 0.42 + n * 0.12 + w.id * 0.08;
    o.r = k; o.g = k * 0.97; o.b = k * 0.93;

    let cx = 0, cz = 0;

function buildGrass() {

function grassiness(x, z) {
  const h = groundAt(x, z);
  if (h < WATER_Y + 0.35 || Math.hypot(x - NEST.x, z - NEST.z) < NEST.r + 2) return 0;
  const sl = slopeAt(x, z);
  if (sl > 0.55) return 0;
  let g = smooth(0.38, 0.6, fbm(x * 0.12 + 5, z * 0.12 + 9, 3));
  g *= 1 - smooth(55, 140, x) * smooth(6, 16, h);
  if (Math.hypot(x - BASE.x, z - BASE.z) < BASE.r - 4) g *= 0.25;
  return g;
}

  const N = grass.instanceMatrix.count, RAD = 34, col = new THREE.Color();

    const a = Math.random() * TAU, r = Math.sqrt(Math.random()) * RAD;

    _m4.compose(_p3.set(x, groundAt(x, z), z), _q, _s3.set(0.7 + Math.random() * 0.5, h, 1));
    grass.setMatrixAt(placed, _m4);
    const dry = Math.random() * 0.6 + smooth(0.5, 0.7, fbm(x * 0.04, z * 0.04, 3)) * 0.4;

// ---------- gathering ----------
function nearestResource(maxD) {
  let best = null, bd = maxD;
  forNearby(P.pos.x, P.pos.z, (c) => {
    if (c.off || !c.obj) return;
    const d = Math.hypot(c.x - P.pos.x, c.z - P.pos.z) - c.r;
    if (d < bd) { bd = d; best = c; }
  });
  return best ? { pos: { x: best.x, z: best.z } } : null;
}
function hitResources(a) {
  forNearby(P.pos.x, P.pos.z, (c) => {
    if (c.off || !c.obj || P.hitSet.has(c.obj)) return;
    const dx = c.x - P.pos.x, dz = c.z - P.pos.z, d = Math.hypot(dx, dz);
    if (d > a.range + c.r * 0.6) return;
    if (!a.spin && Math.abs(angDiff(Math.atan2(dx, dz), P.facing)) > a.arc + 0.2) return;
    P.hitSet.add(c.obj);
    if (c.obj.kind === 'tree') hitTree(c.obj, a); else hitNode(c.obj, a);
  });
}
function chips(x, z, y, color, n) { burst(new THREE.Vector3(x, groundAt(x, z) + y, z), color, n, 5, { size: 0.12, life: 0.6 }); }
function hitTree(t, a) {
  t.hp -= a.dmg >= 3 ? 2 : 1;
  const dx = t.x - P.pos.x, dz = t.z - P.pos.z, d = Math.hypot(dx, dz) || 1;
  chips(t.x - dx / d * 0.4, t.z - dz / d * 0.4, 1.1, 0x8a6a44, 8);
  hitstop = Math.max(hitstop, 0.05);
  shake = Math.max(shake, 0.12);

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i], t = e.t;
    e.time += dt;

      if (e.time > (t.boss ? 6 : 2.5)) R.root.position.y -= dt * 0.8;
      if (e.time > (t.boss ? 8 : 4)) { if (t.boss) wyvernTimer = 180; removeEnemy(e); enemies.splice(i, 1); continue; }
    } else {

      if (e.accel > 0) e.speed += (e.wantSpeed - e.speed) * damp(e.accel, dt);
      e.strafe += (e.wantStrafe - e.strafe) * damp(6, dt);
    }

    e.pos.x += (sf * e.speed + cf * e.strafe) * dt;
    e.pos.z += (cf * e.speed - sf * e.strafe) * dt;

    e.kb.multiplyScalar(Math.exp(-7 * dt));
    e.turnVel = lerp(e.turnVel, angDiff(e.facing, prevFacing) / Math.max(dt, 1e-4), damp(10, dt));
    // hit recoil: a damped spring kicked by each blow
    e.recoilV += (-140 * e.recoil - 14 * e.recoilV) * dt;
    e.recoil += e.recoilV * dt;

    else e.rig.skin.emissive.setRGB(0, 0, 0);

    if (e.state !== 'dead') {

    if (a.state === 'dead' || a.state === 'land') continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (b.state === 'dead' || b.state === 'land') continue;
      const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z, d = Math.hypot(dx, dz), min = a.t.r + b.t.r;

// ---------- monsters in the world ----------
const TYPES = {
  raptor: { hp: 5, r: 0.8, speed: 4.3, dmg: 14, range: 2.2, lunge: 12, windup: 0.5, name: '狗竜', roam: 12 },
  stalker: { hp: 4, r: 0.65, speed: 6.0, dmg: 11, range: 2.0, lunge: 15, windup: 0.42, name: '赤狗竜', roam: 12 },
  wyvern: { hp: 60, r: 2.5, speed: 3.6, dmg: 28, range: 5.5, lunge: 13, windup: 0.7, boss: true, name: '炎鱗竜 ヴァルガ', roam: 14 },

function spawnEnemy(type, x, z, opts) {

    type, t, rig, pos: new THREE.Vector3(x, 0, z), home: new THREE.Vector3(x, 0, z), goal: new THREE.Vector3(x, 0, z),
    kb: new THREE.Vector3(), hp: t.hp, maxHp: t.hp, state: 'idle', time: 0, idleT: Math.random() * 3, flash: 0,
    facing: Math.random() * TAU, dealt: false, bob: Math.random() * TAU, gait: 0, moveSpeed: 0, stepSign: 1,
    cooldown: 1.0, stagger: 0, enraged: false, dmgMul: 1, last: new THREE.Vector3(x, 0, z), seen: false,
    speed: 0, wantSpeed: 0, accel: 5, strafe: 0, wantStrafe: 0, turnVel: 0, toRel: 0, vy: 0, side: Math.random() < 0.5 ? -1 : 1,
    circleT: 1, recoil: 0, recoilV: 0, crouchS: 0, pitchS: 0, rollS: 0, neckS: -0.7, fallDir: 1, recover: 1, combo2: false,
  };
  if (type === 'wyvern') {

function removeEnemy(e) {
  scene.remove(e.rig.root);
  e.rig.skin.dispose();
}
const playerSafe = () => P.dead || Math.hypot(P.pos.x - BASE.x, P.pos.z - BASE.z) < BASE.r + 3;

    e.wantSpeed = 0;

function updateSpawner(dt) {
  // let distant, calm raptors go
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.t.boss || e.state === 'dead') continue;
    if (Math.hypot(e.pos.x - P.pos.x, e.pos.z - P.pos.z) > 140 && CALM[e.state]) { removeEnemy(e); enemies.splice(i, 1); }
  }
  spawnT -= dt;
  if (spawnT <= 0) {
    spawnT = 5 + Math.random() * 4;
    const alive = enemies.filter((e) => !e.t.boss && e.state !== 'dead').length;
    for (let tries = 0; tries < 12 && alive < MAX_RAPTORS; tries++) {
      const a = Math.random() * TAU, d = 55 + Math.random() * 35;
      const x = P.pos.x + Math.sin(a) * d, z = P.pos.z + Math.cos(a) * d;
      if (Math.hypot(x, z) > WORLD_R - 12 || Math.hypot(x - BASE.x, z - BASE.z) < 50) continue;
      if (Math.hypot(x - NEST.x, z - NEST.z) < NEST.r + 15 || groundAt(x, z) < WATER_Y + 0.5) continue;
      const wild = Math.hypot(x, z) > 110;
      const n = Math.min(MAX_RAPTORS - alive, 2 + (Math.random() < 0.4 ? 1 : 0));
      for (let k = 0; k < n; k++) {
        const type = Math.random() < (wild ? 0.5 : 0.2) ? 'stalker' : 'raptor';
        spawnEnemy(type, x + (Math.random() - 0.5) * 8, z + (Math.random() - 0.5) * 8);
      }
      break;
    }
  }
  if (!enemies.some((e) => e.t.boss)) {

    if (wyvernTimer <= 0) spawnEnemy('wyvern', NEST.x, NEST.z);
  }

// ---------- progress, inventory and saving ----------
const SAVE_KEY = 'bladeArenaWorld1';
const ITEMS = { wood: '木材', stone: '石', ore: '鉄鉱石', herb: '薬草', hide: '狗竜の皮', fang: '狗竜の牙', scale: '炎鱗竜の鱗', horn: '炎鱗竜の角', potion: '回復薬' };
const SWORD = [
  { name: '鉄の大剣', mult: 1 },
  { name: '鋼の大剣', mult: 1.35, cost: { ore: 5, wood: 4 } },
  { name: '狗竜の大剣', mult: 1.75, cost: { ore: 8, fang: 4 } },
  { name: '炎鱗の大剣', mult: 2.2, cost: { ore: 10, scale: 3, horn: 1 } },
];
const ARMOR = [
  { name: '革の鎧', hp: 150 },
  { name: '鉄の鎧', hp: 190, cost: { hide: 4, ore: 3 } },
  { name: '狗竜の鎧', hp: 240, cost: { hide: 8, fang: 4, ore: 5 } },
  { name: '炎鱗の鎧', hp: 300, cost: { scale: 4, ore: 6 } },
];
const POTION_COST = { herb: 3 };
const DROPS = {
  raptor: () => [['hide', 1 + (Math.random() < 0.4 ? 1 : 0)], ['fang', Math.random() < 0.4 ? 1 : 0]],
  stalker: () => [['hide', 1], ['fang', Math.random() < 0.6 ? 1 : 0]],
  wyvern: () => [['scale', 3 + (Math.random() < 0.5 ? 1 : 0)], ['horn', 1]],
};
let G = null;
function freshSave() {
  return { v: 1, inv: { wood: 0, stone: 0, ore: 0, herb: 0, hide: 0, fang: 0, scale: 0, horn: 0, potion: 1 }, built: {}, sword: 0, armor: 0,
    stats: { potionsMade: 0, wyvernKills: 0, raptorKills: 0 } };
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return null;
    const f = freshSave();
    Object.assign(f.inv, d.inv); Object.assign(f.built, d.built); Object.assign(f.stats, d.stats);
    f.sword = Math.min(d.sword | 0, SWORD.length - 1); f.armor = Math.min(d.armor | 0, ARMOR.length - 1);
    return f;
  } catch (err) { return null; }
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (err) { /* storage unavailable */ } }
const has = (cost) => Object.keys(cost).every((k) => G.inv[k] >= cost[k]);
function pay(cost) { for (const k in cost) G.inv[k] -= cost[k]; }
function addItem(k, n) {
  if (!n || !G) return;
  G.inv[k] += n;
  toast(ITEMS[k] + ' ×' + n);
  checkGoals();
}
function toast(text) {
  const box = $('toasts'), d = document.createElement('div');
  d.className = 'toast';
  d.textContent = text;
  box.appendChild(d);
  setTimeout(() => d.remove(), 2500);
  while (box.children.length > 5) box.firstChild.remove();
}
function banner(text, sub) {
  const b = $('banner');
  b.textContent = text;
  if (sub) { const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}
const GOALS = [
  { text: '木を斬って木材を8本集めよう', done: () => G.inv.wood >= 8 || G.built.workbench },
  { text: '焚き火の「拠点」から作業台を建てよう', done: () => G.built.workbench },
  { text: '草原で薬草を3つ摘もう', done: () => G.inv.herb >= 3 || G.stats.potionsMade > 0 },
  { text: '作業台で回復薬を作ろう', done: () => G.stats.potionsMade > 0 },
  { text: '岩を斬って石を10個集めよう', done: () => G.inv.stone >= 10 || G.built.forge },
  { text: '拠点に鍛冶場を建てよう', done: () => G.built.forge },
  { text: '東の岩山で鉄鉱石を5個掘ろう', done: () => G.inv.ore >= 5 || G.sword >= 1 },
  { text: '鍛冶場で大剣を強化しよう', done: () => G.sword >= 1 },
  { text: '狗竜を狩って皮を4枚集めよう', done: () => G.inv.hide >= 4 || G.armor >= 1 },
  { text: '鍛冶場で防具を強化しよう', done: () => G.armor >= 1 },
  { text: '拠点に見張り台を建てよう', done: () => G.built.tower },
  { text: '西の巣に棲む炎鱗竜を討伐しよう', done: () => G.stats.wyvernKills > 0 },
];
let goalIdx = -1;
function checkGoals(silent) {
  let i = GOALS.findIndex((g) => !g.done());
  if (i < 0) i = GOALS.length;
  if (i === goalIdx) return;
  const text = i < GOALS.length ? GOALS[i].text : '装備を極め、炎鱗竜を狩り続けよう';
  if (!silent && goalIdx >= 0 && i > goalIdx) banner('目標達成', text);
  goalIdx = i;
  $('goalText').textContent = text;
}
function applyEquipment() {
  P.maxHp = ARMOR[G.armor].hp;
  P.hp = Math.min(P.hp, P.maxHp);
  const blade = PM.M.blade, metal = PM.M.metal;
  blade.color.setHex([0xd6dadf, 0xe8ecf0, 0xe0d6bc, 0xd8a090][G.sword]);
  blade.emissive.setHex(G.sword === 3 ? 0xff3a10 : 0x000000);
  blade.emissiveIntensity = G.sword === 3 ? 0.35 : 0;
  metal.color.setHex([0x8a8f96, 0xb4b8bd, 0x8a9070, 0x9a3a28][G.armor]);
}

// ---------- base menu & inventory ----------
let panelMode = null;
function openPanel(mode) {
  if (state !== 'play') return;
  panelMode = mode;
  state = 'menu';
  input.atkHeld = false;
  releaseStick();

  $('panel').hidden = false;
}
function closePanel() {
  $('panel').hidden = true;
  panelMode = null;
  if (state === 'menu') state = 'play';
}
function costHtml(cost) {
  return Object.keys(cost).map((k) => '<span class="' + (G.inv[k] >= cost[k] ? 'have' : 'lack') + '">' + ITEMS[k] + ' ' + G.inv[k] + '/' + cost[k] + '</span>').join('　');
}
function row(name, desc, cost, act, label, done) {
  return '<div class="row' + (done ? ' done' : '') + '"><div class="name">' + name + '</div><div class="desc">' + desc + '</div>'
    + (cost ? '<div class="cost">' + costHtml(cost) + '</div>' : '')
    + (done ? '<button type="button" disabled>' + done + '</button>' : '<button type="button" data-act="' + act + '"' + (cost && !has(cost) ? ' disabled' : '') + '>' + label + '</button>') + '</div>';
}
function renderPanel() {
  let h = '<header><h2>' + (panelMode === 'base' ? '拠点' : '持ち物') + '</h2><button class="close" type="button" data-act="close">閉じる</button></header>';
  h += '<section><h3>装備</h3><div class="inv"><div>大剣<span>' + SWORD[G.sword].name + '</span></div><div>防具<span>' + ARMOR[G.armor].name + '</span></div><div>体力<span>' + Math.ceil(P.hp) + '/' + P.maxHp + '</span></div></div></section>';
  h += '<section><h3>素材</h3><div class="inv">' + Object.keys(ITEMS).map((k) => '<div>' + ITEMS[k] + '<span>' + G.inv[k] + '</span></div>').join('') + '</div></section>';
  if (panelMode === 'base') {
    h += '<section><h3>休憩</h3><div class="rows">' + row('焚き火で休む', '体力を全回復して記録する', null, 'rest', '休む') + '</div></section>';
    h += '<section><h3>建築</h3><div class="rows">' + Object.keys(STRUCTS).map((k) => {
      const S = STRUCTS[k];
      return row(S.name, S.desc, G.built[k] ? null : S.cost, 'build:' + k, '建てる', G.built[k] ? '建築済み' : null);
    }).join('') + '</div></section>';
    h += '<section><h3>調合</h3>' + (G.built.workbench
      ? '<div class="rows">' + row('回復薬', '体力を60回復する', POTION_COST, 'potion', '作る') + '</div>'
      : '<p class="locked">作業台を建てると調合できます。</p>') + '</section>';
    h += '<section><h3>鍛冶</h3>';

      const ns = SWORD[G.sword + 1], na = ARMOR[G.armor + 1];
      h += '<div class="rows">'
        + (ns ? row('大剣強化：' + ns.name, '攻撃力 ×' + ns.mult, ns.cost, 'sword', '強化') : row(SWORD[G.sword].name, '最大まで強化済み', null, '', '', '最大'))
        + (na ? row('防具強化：' + na.name, '最大体力 ' + na.hp, na.cost, 'armor', '強化') : row(ARMOR[G.armor].name, '最大まで強化済み', null, '', '', '最大'))
        + '</div>';

$('sheet').addEventListener('click', (ev) => {
  const b = ev.target.closest('button');
  if (!b || b.disabled) return;
  const act = b.dataset.act || '';
  if (act === 'close') { closePanel(); return; }
  if (act === 'rest') { P.hp = P.maxHp; save(); toast('体力が全回復した（記録しました）'); }
  else if (act.startsWith('build:')) {
    const k = act.slice(6), S = STRUCTS[k];
    if (G.built[k] || !has(S.cost)) return;
    pay(S.cost); G.built[k] = true;
    buildStructure(k, true);
    dustPuff(S.x, S.z, 10, 3);
    toast(S.name + 'を建てた');
    save();
  } else if (act === 'potion' && has(POTION_COST)) { pay(POTION_COST); G.inv.potion++; G.stats.potionsMade++; toast('回復薬 ×1'); save(); }
  else if (act === 'sword' && SWORD[G.sword + 1] && has(SWORD[G.sword + 1].cost)) { pay(SWORD[G.sword + 1].cost); G.sword++; applyEquipment(); toast(SWORD[G.sword].name + 'に強化した'); save(); }
  else if (act === 'armor' && ARMOR[G.armor + 1] && has(ARMOR[G.armor + 1].cost)) { pay(ARMOR[G.armor + 1].cost); G.armor++; applyEquipment(); P.hp = P.maxHp; toast(ARMOR[G.armor].name + 'に強化した'); save(); }
  checkGoals();
  renderPanel();
});

// ---------- context actions: gather, base, potion ----------
let ctx = null;
function getContext() {
  if (P.dead || P.act || !P.onGround) return null;
  if (Math.hypot(P.pos.x - FIRE.x, P.pos.z - FIRE.z) < 5) return { kind: 'base', label: '拠点' };
  const h = nearestHerb(2.4);
  if (h) return { kind: 'herb', label: '採取', herb: h };
  return null;
}
function doAct() {
  if (state !== 'play' || !ctx) return;
  if (ctx.kind === 'base') openPanel('base');
  else if (ctx.kind === 'herb') {
    P.gatherTarget = ctx.herb;
    P.facing = Math.atan2(ctx.herb.x - P.pos.x, ctx.herb.z - P.pos.z);
    startAction('gather');
  }
}
function usePotion() {
  if (state !== 'play' || P.dead || P.act || !P.onGround) return;
  if (G.inv.potion <= 0) { toast('回復薬がありません'); return; }
  if (P.hp >= P.maxHp) { toast('体力は満タンです'); return; }
  G.inv.potion--;
  P.drinkPending = true;
  startAction('drink');
}
function actionHooks() {
  if (P.actName === 'gather' && P.act && P.actT > 0.45 && P.gatherTarget) { collectHerb(P.gatherTarget); P.gatherTarget = null; }
  if (P.actName === 'drink' && P.act && P.actT > 0.6 && P.drinkPending) {
    P.drinkPending = false;
    P.hp = Math.min(P.maxHp, P.hp + 60);
    burst(new THREE.Vector3(P.pos.x, groundAt(P.pos.x, P.pos.z) + 1.2, P.pos.z), 0x9af07a, 12, 2, { additive: true, size: 0.06, grav: -2, life: 0.9 });
  }
  if (P.actName !== 'drink') P.drinkPending = false;
}
function playerDown() {
  P.dead = true;
  P.deadT = 0;
  banner('力尽きました', '拠点に戻ります');
}
function respawnAtBase() {
  P.dead = false;
  P.act = null; P.actName = '';
  P.hp = P.maxHp;
  P.pos.set(FIRE.x + 2.5, 0, FIRE.z + 3);
  P.kb.set(0, 0, 0); P.speed = 0; P.vy = 0; P.onGround = true;
  P.facing = Math.PI;
  yaw = 0;
  camTarget.set(P.pos.x, groundAt(P.pos.x, P.pos.z) + 1.4, P.pos.z);
  refillGrass();
  $('fade').style.opacity = 0;
}

// ---------- game state ----------
let state = 'loading';
let hitstop = 0, shake = 0, time = 0;
let yaw = 0, pitch = 0.42;
const camTarget = new THREE.Vector3(0, 3, 0);
let saveT = 0, hudT = 0, mapT = 0;

function startGame(cont) {
  if (state !== 'title') return;
  G = (cont && loadSave()) || freshSave();
  if (!cont) save();
  for (const k in STRUCTS) buildStructure(k, !!G.built[k]);
  P.hp = 9999;
  applyEquipment();
  P.hp = P.maxHp;
  enemies.forEach(removeEnemy);
  enemies = [];
  wyvernTimer = 0; spawnT = 6;
  respawnAtBase();
  goalIdx = -1;
  checkGoals(true);
  $('overlay').hidden = true;
  state = 'play';
  setControlsVisible(true);
  banner('辺境の拠点', $('goalText').textContent);
}
function setControlsVisible(v) {
  $('hud').hidden = !v;
  $('buttons').hidden = !v || !isTouch;
  $('hint').hidden = !v || isTouch;
  if (!v) { releaseStick(); $('bossBox').hidden = true; }
}
function updateHud(dt) {
  const k = Math.max(P.hp, 0) / P.maxHp;
  $('hpBar').style.width = (k * 100) + '%';
  $('hpBar').classList.toggle('low', k < 0.3);
  $('potionCount').textContent = G.inv.potion;
  const boss = enemies.find((e) => e.t.boss && !CALM[e.state] && e.state !== 'dead' && Math.hypot(e.pos.x - P.pos.x, e.pos.z - P.pos.z) < 70);
  $('bossBox').hidden = !boss;
  if (boss) $('bossBar').style.width = (Math.max(boss.hp, 0) / boss.maxHp * 100) + '%';
  ctx = getContext();
  const btn = $('btnAct');
  btn.hidden = !ctx;
  if (ctx && btn.textContent !== ctx.label) btn.textContent = ctx.label;
  hudT -= dt;
  if (hudT <= 0) { hudT = 0.5; $('area').textContent = areaName(P.pos.x, P.pos.z); }
}

// ---------- minimap ----------
const mm = $('minimap'), mctx = mm.getContext('2d');
const MM_DPR = Math.min(window.devicePixelRatio || 1, 2);
mm.width = mm.height = Math.round(112 * MM_DPR);
function drawMinimap() {
  const W = mm.width, R = W / 2, VIEW = 140, s = W / VIEW;
  mctx.save();
  mctx.clearRect(0, 0, W, W);
  mctx.beginPath(); mctx.arc(R, R, R, 0, TAU); mctx.clip();
  mctx.translate(R, R); mctx.scale(s, s); mctx.translate(-P.pos.x, -P.pos.z);
  mctx.imageSmoothingEnabled = true;
  mctx.drawImage(mapCanvas, -WORLD_HALF - GRID / 2, -WORLD_HALF - GRID / 2, GN * GRID, GN * GRID);
  // base
  mctx.strokeStyle = 'rgba(201,154,75,0.9)'; mctx.lineWidth = 1.2;
  mctx.beginPath(); mctx.arc(BASE.x, BASE.z, BASE.r, 0, TAU); mctx.stroke();
  for (const k in STRUCTS) if (G.built[k]) { mctx.fillStyle = '#c99a4b'; mctx.fillRect(STRUCTS[k].x - 1.5, STRUCTS[k].z - 1.5, 3, 3); }
  // monsters: seen up close, or from afar once the watchtower stands
  const range = G.built.tower ? 120 : 30;
  for (const e of enemies) {
    if (e.state === 'dead' || e.state === 'display') continue;
    if (Math.hypot(e.pos.x - P.pos.x, e.pos.z - P.pos.z) > range && !(e.t.boss && goalIdx >= 11)) continue;
    mctx.fillStyle = e.t.boss ? '#ff6a3a' : '#e0503a';
    mctx.beginPath(); mctx.arc(e.pos.x, e.pos.z, e.t.boss ? 3.5 : 1.8, 0, TAU); mctx.fill();
  }
  mctx.restore();
  // edge markers: home, and the nest once it is the goal
  const edge = (x, z, color) => {
    const dx = x - P.pos.x, dz = z - P.pos.z, d = Math.hypot(dx, dz);
    if (d * s < R - 6) return;
    const px = R + dx / d * (R - 7), pz = R + dz / d * (R - 7);
    mctx.fillStyle = color; mctx.strokeStyle = '#000'; mctx.lineWidth = 1;
    mctx.beginPath(); mctx.arc(px, pz, 4.5 * MM_DPR, 0, TAU); mctx.fill(); mctx.stroke();
  };
  edge(BASE.x, BASE.z, '#c99a4b');
  if (goalIdx >= 11) edge(NEST.x, NEST.z, '#ff6a3a');
  // the hunter
  mctx.save();
  mctx.translate(R, R);
  mctx.rotate(-P.facing + Math.PI);
  mctx.fillStyle = '#f1e6cf'; mctx.strokeStyle = '#000'; mctx.lineWidth = 1.5;
  mctx.beginPath(); mctx.moveTo(0, -7 * MM_DPR); mctx.lineTo(5 * MM_DPR, 5 * MM_DPR); mctx.lineTo(0, 2 * MM_DPR); mctx.lineTo(-5 * MM_DPR, 5 * MM_DPR); mctx.closePath();
  mctx.fill(); mctx.stroke();
  mctx.restore();
}

// ---------- camera ----------
let camTime = 0, baseFov = 55, e_dist = 13;
function updateCamera(realDt) {
  camTime += realDt;
  const portrait = camera.aspect < 1;
  const bossNear = enemies.some((e) => e.t.boss && !CALM[e.state] && e.state !== 'dead' && Math.hypot(e.pos.x - P.pos.x, e.pos.z - P.pos.z) < 40);
  const dist = (portrait ? 12 : 9) + (bossNear ? 3 : 0);
  const gy = groundAt(P.pos.x, P.pos.z);
  let tx = P.pos.x + Math.sin(P.facing) * P.speed * 0.2, ty = gy + 1.4 + P.pos.y * 0.4, tz = P.pos.z + Math.cos(P.facing) * P.speed * 0.2;
  if (state === 'title' || state === 'loading') { tx = FIRE.x; ty = groundAt(FIRE.x, FIRE.z) + 2.2; tz = FIRE.z; }
  camTarget.x += (tx - camTarget.x) * damp(5, realDt);
  camTarget.z += (tz - camTarget.z) * damp(5, realDt);
  camTarget.y += (ty - camTarget.y) * damp(4, realDt);
  e_dist = lerp(e_dist, state === 'title' ? 14 : dist, damp(2.5, realDt));
  camera.position.set(
    camTarget.x + Math.sin(yaw) * Math.cos(pitch) * e_dist,
    camTarget.y + Math.sin(pitch) * e_dist,
    camTarget.z + Math.cos(yaw) * Math.cos(pitch) * e_dist
  );
  // pull the camera in front of trees and boulders that would hide the hunter
  if (state === 'play') {
    const steps = Math.ceil(e_dist / 0.5);
    let hitK = 1;
    for (let i = 3; i <= steps && hitK === 1; i++) {
      const k = i / steps;
      const px = lerp(camTarget.x, camera.position.x, k), py = lerp(camTarget.y, camera.position.y, k), pz = lerp(camTarget.z, camera.position.z, k);
      forNearby(px, pz, (c) => {
        if (c.off || hitK < 1) return;
        const d = Math.hypot(px - c.x, pz - c.z), g = groundAt(c.x, c.z);
        const tree = c.obj && c.obj.kind === 'tree';
        const blocks = tree ? d < 1.7 * c.obj.s && py > g + 1.6 * c.obj.s && py < g + 6.2 * c.obj.s
          : !c.obj && d < c.r && py < g + c.r * 1.3;
        if (blocks) hitK = Math.max(0.15, (i - 1.5) / steps);
      });
    }
    if (hitK < 1) camera.position.lerpVectors(camTarget, camera.position, hitK);
  }
  const floor = groundAt(camera.position.x, camera.position.z) + 0.7;
  if (camera.position.y < floor) camera.position.y = floor;
  _v.copy(camTarget);
  if (shake > 0) {
    const a = shake * shake * 2.2;
    const ox = (Math.sin(camTime * 47) + Math.sin(camTime * 31.7) * 0.6) * a, oy = (Math.sin(camTime * 53.3) + Math.sin(camTime * 23.1) * 0.6) * a;
    camera.position.x += ox; camera.position.y += oy;
    _v.x += ox * 0.4; _v.y += oy * 0.4;
    shake = Math.max(0, shake - realDt * 1.5);
  }
  camera.lookAt(_v);
  const wantFov = baseFov + (P.actName === 'roll' && P.act ? 4 : 0) + (P.act && P.act.spin ? 2 : 0);
  if (Math.abs(camera.fov - wantFov) > 0.01) { camera.fov = lerp(camera.fov, wantFov, damp(6, realDt)); camera.updateProjectionMatrix(); }
  sky.position.copy(camera.position);
  sun.position.set(camTarget.x + SUN_DIR.x * 60, camTarget.y + SUN_DIR.y * 60, camTarget.z + SUN_DIR.z * 60);
  sun.target.position.copy(camTarget);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  baseFov = camera.aspect < 1 ? 70 : 55;
  camera.fov = baseFov;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
document.addEventListener('visibilitychange', () => { if (document.hidden && G && state !== 'title') save(); });

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const realDt = Math.min((now - last) / 1000, 0.05);
  last = now;
  let dt = realDt;
  if (hitstop > 0) { hitstop -= realDt; dt *= 0.05; }
  if (state === 'menu') dt = 0;
  time += dt;
  grassUniform.value = time;

  if (state === 'play') {
    updatePlayer(dt);
    actionHooks();
    updateSpawner(dt);
    updateEnemies(dt);
    updateWorld(dt);
    if (P.dead) {
      P.deadT += dt;
      if (P.deadT > 2.4) $('fade').style.opacity = 1;
      if (P.deadT > 3.4) respawnAtBase();
    }
    updateHud(dt);
    mapT -= realDt;
    if (mapT <= 0) { mapT = 0.1; drawMinimap(); }
    saveT += dt;
    if (saveT > 30) { saveT = 0; save(); }
  } else if (state === 'title') {
    yaw += realDt * 0.08;
    pitch = 0.22;
    updateWorld(dt);
    computeLoco(dt);
    Object.assign(P.pose, P.loco);
    PM.root.position.set(P.pos.x, groundAt(P.pos.x, P.pos.z), P.pos.z);
    PM.model.rotation.y = P.facing;
    applyPose(P.pose);
  }
  if (dust) { dust.position.set(camTarget.x, camTarget.y - 1.5, camTarget.z); dust.rotation.y = time * 0.02; }
  updateParts(dt);
  updateClouds(dt);
  updateTrail(dt, !!(P.act && P.act.trail && P.actT >= P.act.trail[0] && P.actT <= P.act.trail[1]));
  updateCamera(realDt);
  renderer.render(scene, camera);
}

// build everything after the loading text has painted
requestAnimationFrame(() => setTimeout(() => {
  try {
    buildTextures();
    buildEnvironmentMap();
    buildWorld();
    PM = makeHunter();
    P.pos.set(FIRE.x + 2.5, 0, FIRE.z + 3);
    P.facing = Math.PI * 0.8;
    G = freshSave();
    refillGrass();
    state = 'title';
    const saved = loadSave();
    $('contBtn').hidden = !saved;
    $('loading').hidden = true;
    $('startRow').hidden = false;
    requestAnimationFrame(frame);
  } catch (err) {
    $('loading').hidden = true;
    $('error').hidden = false;
    $('error').textContent = '3D表示の初期化に失敗しました（' + err.message + '）。';
  }
}, 30));
})();
</script>
</body>
</html>
